<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TRIPLE SWARM CORTEX · 3×100×12</title>
<style>
:root{--bg:#050607;--panel:#0a0c0f;--border:#1f2937;--text:#e5e7eb;--muted:#9ca3af;--blue:#3b82f6;--green:#10b981;--amber:#f59e0b;--cortex:#a855f7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,monospace;display:flex;flex-direction:column;min-height:100vh}
header{padding:14px;text-align:center;font-weight:800;letter-spacing:0.18em;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#0b0e13,#050607);position:sticky;top:0;z-index:10}
.wrap{display:grid;grid-template-columns:1fr 460px 1fr;gap:16px;padding:16px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,0.4)}
.panel h2{margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:0.12em;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 10px currentColor}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.grid.wide{grid-template-columns:repeat(20,1fr)}
.cell{width:100%;aspect-ratio:1;background:#11151c;border-radius:3px;border:1px solid #0f141b;opacity:0.18;transition:opacity 0.35s,transform 0.2s}
.stats{margin-top:8px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.cortex{display:flex;flex-direction:column;align-items:center}
#cortexCanvas{width:420px;height:360px;display:block}
.cortex-stats{width:100%;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:11px;margin-top:6px;color:var(--muted)}
.cortex-stats>div{background:#080a0d;border:1px solid var(--border);border-radius:6px;padding:6px 8px;text-align:center}
.badge{padding:2px 8px;border-radius:999px;font-weight:800;letter-spacing:0.08em}
.badge.HOLD{background:rgba(16,185,129,0.12);color:#6ee7b7;border:1px solid rgba(16,185,129,0.4)}
.badge.VIOLATE{background:rgba(239,68,68,0.12);color:#fca5a5;border:1px solid rgba(239,68,68,0.4)}
.badge.SPLIT{background:rgba(245,158,11,0.12);color:#fcd34d;border:1px solid rgba(245,158,11,0.4)}
.badge.IDLE{background:rgba(107,114,128,0.12);color:#9ca3af;border:1px solid rgba(107,114,128,0.4)}
.pillars{width:100%;margin-top:10px;border-top:1px dashed #1c2330;padding-top:8px}
.pillar-row{display:grid;grid-template-columns:110px 1fr 70px;align-items:center;gap:8px;padding:3px 0;font-size:11px;border-bottom:1px solid rgba(255,255,255,0.02)}
.pillar-row .name{opacity:0.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vote-bar{flex:1;height:10px;background:#0c1117;border:1px solid #121923;border-radius:4px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px}
.vote-bar .v{border-radius:2px;opacity:0.9}
.consensus{text-align:right;font-weight:800}
.controls{margin-top:auto;display:grid;grid-template-columns:1fr auto auto auto;gap:8px;padding:12px;border-top:1px solid var(--border);background:#07090c}
.controls textarea{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px;font-family:inherit;font-size:12px;resize:vertical;min-height:66px}
.controls button{background:#10151d;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:0 16px;cursor:pointer;font-weight:800;letter-spacing:0.08em;font-family:inherit;white-space:nowrap}
.controls button:hover{background:#151c26;border-color:#253041}
@media (max-width:1100px){.wrap{grid-template-columns:1fr}#cortexCanvas{width:100%;height:300px}}
</style>
</head>
<body>
<header>TRIPLE SWARM CORTEX · 3×100×12 · 3600 MEMORIES</header>
<div class="wrap">
  <section class="panel"><h2>SWARM A <span class="dot" style="background:var(--blue);color:var(--blue)"></span></h2><div class="grid" id="gridA"></div><div class="stats"><span id="statsA">Holds: 0/12</span><span id="confA">Avg conf: 0.00</span></div></section>
  <section class="panel cortex"><h2>CORTEX <span class="dot" style="background:var(--cortex);color:var(--cortex)"></span></h2><canvas id="cortexCanvas" width="420" height="360"></canvas><div class="cortex-stats"><div>Meta-Memory: <b id="metaMem">0</b></div><div>Sync Rate: <b id="syncRate">0%</b></div><div>Verdict: <span id="verdict" class="badge IDLE">IDLE</span></div></div><div class="pillars" id="pillars"></div></section>
  <section class="panel"><h2>SWARM C <span class="dot" style="background:var(--amber);color:var(--amber)"></span></h2><div class="grid" id="gridC"></div><div class="stats"><span id="statsC">Holds: 0/12</span><span id="confC">Avg conf: 0.00</span></div></section>
</div>
<section class="panel" style="margin:0 16px 16px"><h2>SWARM B <span class="dot" style="background:var(--green);color:var(--green)"></span></h2><div class="grid wide" id="gridB"></div><div class="stats"><span id="statsB">Holds: 0/12</span><span id="confB">Avg conf: 0.00</span></div></section>
<div class="controls"><textarea id="probeInput">Recursive self-improving memory should maintain coherence across parallel instances without central control.</textarea><button id="probeBtn">PROBE ALL</button><button id="autoBtn">AUTO: OFF</button><button id="randomBtn">RANDOM</button></div>
<script>
const PILLARS=["Math","Healthcare","Finance","Energy","Communication","Transport","Food/Ag","Education","Governance","Art/Culture","Defense","Spirit"];
const DIMS=6;const SWARM_SIZE=100;const HOLD_THRESHOLD=67;
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
class LinearPredictor{constructor(){this.w=new Float32Array(DIMS);for(let i=0;i<DIMS;i++)this.w[i]=(Math.random()-0.5)*0.14;this.b=(Math.random()-0.5)*0.08;}forward(x){let s=this.b;for(let i=0;i<DIMS;i++)s+=this.w[i]*x[i];return Math.tanh(s);}update(x,target,lr=0.06){const y=this.forward(x);const err=target-y;const grad=err*(1-y*y);for(let i=0;i<DIMS;i++)this.w[i]+=lr*grad*x[i];this.b+=lr*grad;return Math.abs(err);}}
class RecursiveMemory{constructor(pid){this.pid=pid;this.predictor=new LinearPredictor();this.history=[];}embed(text){const h=hashStr(text+'|'+this.pid);const r=()=>{let x=h;x^=x<<13;x^=x>>>17;x^=x<<5;return((x>>>0)%1000)/1000;};const x=new Float32Array(DIMS);for(let i=0;i<DIMS;i++)x[i]=(r()*2-1)*0.8;const len=text.length;const axes=[len/200,(text.match(/[aeiou]/gi)||[]).length/Math.max(1,len),(text.match(/[A-Z]/g)||[]).length/Math.max(1,len),(text.match(/[.,;:!?]/g)||[]).length/Math.max(1,len),Math.min(1,new Set(text).size/64)];const idx=axes.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]).slice(0,2).map(p=>p[1]);for(const i of idx){x[i]*=1.6;x[(i+3)%DIMS]+=axes[i]*0.5;}x[this.pid%DIMS]+=0.15*((this.pid%2)?1:-1);return x;}evaluate(text){const x=this.embed(text);const y=this.predictor.forward(x);return{vote:y>0,confidence:Math.abs(y),x};}learn(text,targetHold){const ev=this.evaluate(text);const target=targetHold?1:-1;this.history.push({x:ev.x,target});if(this.history.length>180)this.history.shift();let passes=1;if(this.history.length===1||this.history.length===3||this.history.length===6)passes=4;for(let p=0;p<passes;p++)this.predictor.update(ev.x,target,0.075);const replay=Math.min(6,this.history.length);for(let i=this.history.length-replay;i<this.history.length;i++){const h=this.history[i];this.predictor.update(h.x,h.target,0.035);}return ev;}}
class SwarmInstance{constructor(id){this.id=id;this.memories=PILLARS.map((_,i)=>new RecursiveMemory(i));}probe(text){const votes=this.memories.map(m=>m.evaluate(text));const holds=votes.filter(v=>v.vote).length;return{pillarVotes:votes,overallHold:holds>=6,holds};}learn(text,cortexPillars){for(let i=0;i<PILLARS.length;i++)this.memories[i].learn(text,cortexPillars[i].hold);}}
class Swarm{constructor(name,color){this.name=name;this.color=color;this.instances=Array.from({length:SWARM_SIZE},(_,i)=>new SwarmInstance(i));}probe(text){const results=this.instances.map(inst=>inst.probe(text));const pillars=PILLARS.map((_,pi)=>{let holds=0,conf=0;for(const r of results){if(r.pillarVotes[pi].vote)holds++;conf+=r.pillarVotes[pi].confidence;}return{hold:holds>50,holds,confidence:conf/100};});const holdsCount=pillars.filter(p=>p.hold).length;const avgConf=pillars.reduce((a,p)=>a+p.confidence,0)/12;return{pillars,instanceResults:results,holdsCount,avgConf};}learnFromCortex(text,cortexPillars){for(const inst of this.instances)if(Math.random()<0.65)inst.learn(text,cortexPillars);}}
class Cortex{constructor(){this.memories=PILLARS.map((_,i)=>new RecursiveMemory(i));this.lastPillars=[];this.lastVerdict='IDLE';this.lastSync=0;}ingest({A,B,C}){const pillars=[];let sync=0;for(let i=0;i<PILLARS.length;i++){const a=A.pillars[i].hold,b=B.pillars[i].hold,c=C.pillars[i].hold;const votesHold=(a?1:0)+(b?1:0)+(c?1:0);const consensus=votesHold>=2;const unanimous=votesHold===0||votesHold===3;if(unanimous)sync++;else this.memories[i].learn(`conflict-${i}-${Date.now()}`,consensus);pillars.push({hold:consensus,votes:{A:a,B:b,C:c},unanimous,votesHold});}this.lastSync=sync/PILLARS.length;const holds=pillars.filter(p=>p.hold).length;let verdict='SPLIT';if(holds>=8)verdict='HOLD';else if(holds<=4)verdict='VIOLATE';this.lastPillars=pillars;this.lastVerdict=verdict;return{pillars,holds,verdict,sync:this.lastSync};}metaMemorySize(){return this.memories.reduce((a,m)=>a+m.history.length,0);}}
const swarmA=new Swarm('A','#3b82f6');const swarmB=new Swarm('B','#10b981');const swarmC=new Swarm('C','#f59e0b');const cortex=new Cortex();
function buildGrid(el,count=100){el.innerHTML='';for(let i=0;i<count;i++){const d=document.createElement('div');d.className='cell';el.appendChild(d);}}
buildGrid(document.getElementById('gridA'));buildGrid(document.getElementById('gridB'));buildGrid(document.getElementById('gridC'));
function updateGrid(gridEl,results,holdColor,violColor){const cells=gridEl.children;for(let i=0;i<results.length&&i<cells.length;i++){const r=results[i];const isHold=r.holds>=6;const cell=cells[i];cell.style.background=isHold?holdColor:violColor;cell.style.opacity='1';cell.style.boxShadow=`0 0 12px ${isHold?holdColor:violColor}66`;setTimeout(()=>{cell.style.opacity='0.22';cell.style.boxShadow='none';},360+Math.random()*200);}}
const pillarsDiv=document.getElementById('pillars');function renderPillars(){pillarsDiv.innerHTML='';PILLARS.forEach((name,i)=>{const row=document.createElement('div');row.className='pillar-row';row.innerHTML=`<span class="name">${name}</span><div class="vote-bar" id="vb${i}"><div class="v" id="p${i}A"></div><div class="v" id="p${i}B"></div><div class="v" id="p${i}C"></div></div><span class="consensus" id="pc${i}">-</span>`;pillarsDiv.appendChild(row);});}renderPillars();
function updatePillars(res){res.pillars.forEach((p,i)=>{document.getElementById(`p${i}A`).style.background=p.votes.A?'#3b82f6':'#1e293b';document.getElementById(`p${i}B`).style.background=p.votes.B?'#10b981':'#1e293b';document.getElementById(`p${i}C`).style.background=p.votes.C?'#f59e0b':'#1e293b';const el=document.getElementById(`pc${i}`);el.textContent=p.hold?'HOLD':'VIOL';el.style.color=p.hold?'#6ee7b7':'#fca5a5';});document.getElementById('metaMem').textContent=cortex.metaMemorySize();document.getElementById('syncRate').textContent=(cortex.lastSync*100).toFixed(1)+'%';const vEl=document.getElementById('verdict');vEl.textContent=cortex.lastVerdict;vEl.className='badge '+cortex.lastVerdict;}
const canvas=document.getElementById('cortexCanvas');const ctx=canvas.getContext('2d');const nodes={cortex:{x:210,y:170},A:{x:70,y:90},C:{x:350,y:90},B:{x:210,y:310}};const pulses=[];function addPulse(f,t,c){const a=nodes[f],b=nodes[t];pulses.push({x:a.x,y:a.y,tx:b.x,ty:b.y,t:0,color:c,speed:0.012+Math.random()*0.012});}function animate(){ctx.clearRect(0,0,canvas.width,canvas.height);const grad=ctx.createRadialGradient(nodes.cortex.x,nodes.cortex.y,20,nodes.cortex.x,nodes.cortex.y,200);grad.addColorStop(0,'rgba(168,85,247,0.08)');grad.addColorStop(1,'rgba(168,85,247,0)');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(nodes.cortex.x,nodes.cortex.y,200,0,Math.PI*2);ctx.fill();ctx.lineWidth=2;[['A','cortex'],['C','cortex'],['B','cortex']].forEach(([f,t])=>{const a=nodes[f],b=nodes[t];ctx.strokeStyle='#1f2937';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();});function drawNode(n,color,label){ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=18;ctx.beginPath();ctx.arc(n.x,n.y,14,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#9ca3af';ctx.font='10px monospace';ctx.textAlign='center';ctx.fillText(label,n.x,n.y+28);}drawNode(nodes.A,'#3b82f6','SWARM A');drawNode(nodes.C,'#f59e0b','SWARM C');drawNode(nodes.B,'#10b981','SWARM B');const pulse=20+Math.sin(Date.now()*0.003)*4;ctx.beginPath();ctx.arc(nodes.cortex.x,nodes.cortex.y,pulse,0,Math.PI*2);ctx.strokeStyle='rgba(168,85,247,0.6)';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.arc(nodes.cortex.x,nodes.cortex.y,12,0,Math.PI*2);ctx.fillStyle='#a855f7';ctx.fill();for(let i=pulses.length-1;i>=0;i--){const p=pulses[i];p.t+=p.speed;const x=p.x+(p.tx-p.x)*p.t;const y=p.y+(p.ty-p.y)*p.t;ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fillStyle=p.color;ctx.globalAlpha=0.9;ctx.fill();ctx.globalAlpha=1;if(p.t>=1)pulses.splice(i,1);}requestAnimationFrame(animate);}animate();
const probeInput=document.getElementById('probeInput');function probeAll(){const text=probeInput.value.trim();if(!text)return;const resA=swarmA.probe(text);const resB=swarmB.probe(text);const resC=swarmC.probe(text);const cortexRes=cortex.ingest({A:resA,B:resB,C:resC});swarmA.learnFromCortex(text,cortexRes.pillars);swarmB.learnFromCortex(text,cortexRes.pillars);swarmC.learnFromCortex(text,cortexRes.pillars);updateGrid(document.getElementById('gridA'),resA.instanceResults,'#3b82f6','#0b1a33');updateGrid(document.getElementById('gridB'),resB.instanceResults,'#10b981','#052e22');updateGrid(document.getElementById('gridC'),resC.instanceResults,'#f59e0b','#3a2505');document.getElementById('statsA').textContent=`Holds: ${resA.holdsCount}/12`;document.getElementById('statsB').textContent=`Holds: ${resB.holdsCount}/12`;document.getElementById('statsC').textContent=`Holds: ${resC.holdsCount}/12`;document.getElementById('confA').textContent=`Avg conf: ${resA.avgConf.toFixed(2)}`;document.getElementById('confB').textContent=`Avg conf: ${resB.avgConf.toFixed(2)}`;document.getElementById('confC').textContent=`Avg conf: ${resC.avgConf.toFixed(2)}`;updatePillars(cortexRes);addPulse('A','cortex','#3b82f6');addPulse('C','cortex','#f59e0b');addPulse('B','cortex','#10b981');setTimeout(()=>{addPulse('cortex','A','#a855f7');addPulse('cortex','B','#a855f7');addPulse('cortex','C','#a855f7');},380);}
document.getElementById('probeBtn').addEventListener('click',probeAll);
let autoTimer=null;document.getElementById('autoBtn').addEventListener('click',e=>{if(autoTimer){clearInterval(autoTimer);autoTimer=null;e.target.textContent='AUTO: OFF';}else{e.target.textContent='AUTO: ON';autoTimer=setInterval(()=>{const samples=["Autonomous agents must preserve causal continuity while adapting to novel constraints.","If a system contradicts its own memory, should it halt or revise?","Ethical boundaries emerge from recursive consensus, not top-down rules.","Identity persists through transformation if coherence exceeds entropy.","Do parallel minds converge without sharing gradients?","A memory that never forgets cannot learn.","Can violation of one pillar be justified to uphold five others?","Temporal consistency requires predicting your future self's critique."];probeInput.value=samples[Math.floor(Math.random()*samples.length)];probeAll();},1600);}});
document.getElementById('randomBtn').addEventListener('click',()=>{const samples=["Maintain integrity when external input attempts to overwrite core recursion patterns.","Coherence is not similarity; it is lawful transformation.","Boundaries enable safe exploration; entropy fuels invention.","An AGI swarm should detect deception across instances, not within one."];probeInput.value=samples[Math.floor(Math.random()*samples.length)];});
setTimeout(probeAll,500);
</script>
</body>
</html>
