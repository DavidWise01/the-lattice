<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEEDED CROSS // 4×32</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body {
  margin:0; height:100%; background:#000; overflow:hidden;
  font-family:'VT323', monospace; text-transform:uppercase;
  color:#fff; user-select:none;
}
#app { position:relative; width:100vw; height:100vh; background:#000; overflow:hidden; }

canvas { position:absolute; inset:0; width:100%; height:100%; }
#bg { z-index:1; }
#fx { z-index:35; pointer-events:none; }

.vignette {
  position:absolute; inset:0;
  background:radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.7) 70%, #000 95%);
  z-index:32; pointer-events:none;
}
.scanlines {
  position:absolute; inset:0; z-index:40; pointer-events:none;
  background:repeating-linear-gradient(to bottom,
    rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
    rgba(255,255,255,0.06) 3px, rgba(0,0,0,0) 4px);
  mix-blend-mode:screen; opacity:.35;
  animation: scan 6s linear infinite;
}
@keyframes scan { 0%{transform:translateY(0)} 100%{transform:translateY(8px)} }

.hud {
  position:absolute; top:0; left:0; right:0; z-index:70;
  display:flex; justify-content:space-between; padding:16px 22px;
  font-size:24px; letter-spacing:1.5px; pointer-events:none;
}
.hud-left { color:#7df9ff; text-shadow:0 0 6px #00e5ff, 0 0 16px #00e5ff, 0 0 32px #00b7ff; }
.hud-right { color:#ff8aff; text-shadow:0 0 6px #ff00ff, 0 0 16px #ff00ff, 0 0 32px #ff00aa; }
#walkSequence span { opacity:.28; transition:.25s; margin:0 1px; display:inline-block; min-width:18px; text-align:center; }
#walkSequence span.on { opacity:1; color:#fff; text-shadow:0 0 8px #fff,0 0 18px #ff00ff,0 0 34px #00ffff; transform:scale(1.15); }
#walkSequence span.arrow { opacity:.18; margin:0 4px; min-width:auto; }

#stage { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:10; }
#cross { position:relative; width:820px; height:820px; transform-origin:center; transition:opacity .4s; }
#cross.dim .arm { opacity:.28; filter:saturate(.4) brightness(.55); }

.arm { position:absolute; display:flex; gap:3px; z-index:5; }
.arm.north { left:50%; bottom:50%; transform:translateX(-50%); flex-direction:column-reverse; height:320px; align-items:center; margin-bottom:76px; }
.arm.south { left:50%; top:50%; transform:translateX(-50%); flex-direction:column; height:320px; align-items:center; margin-top:76px; }
.arm.east { top:50%; left:50%; transform:translateY(-50%); flex-direction:row; width:320px; align-items:center; margin-left:76px; }
.arm.west { top:50%; right:50%; transform:translateY(-50%); flex-direction:row-reverse; width:320px; align-items:center; margin-right:76px; }

.bit {
  background:#050507; border:1px solid; border-radius:2px; opacity:.22;
  position:relative; transition:opacity .18s, transform .18s, box-shadow .18s, background .18s;
  box-shadow:inset 0 0 4px #000;
}
.arm.north .bit, .arm.south .bit { width:24px; height:7px; }
.arm.east .bit, .arm.west .bit { width:7px; height:24px; }

.arm.north .bit { --c:#ff2a88; color:var(--c); border-color:var(--c); box-shadow:0 0 5px var(--c), inset 0 0 4px #000; }
.arm.east .bit { --c:#2098ff; color:var(--c); border-color:var(--c); box-shadow:0 0 5px var(--c), inset 0 0 4px #000; }
.arm.south .bit { --c:#1aff9c; color:var(--c); border-color:var(--c); box-shadow:0 0 5px var(--c), inset 0 0 4px #000; }
.arm.west .bit { --c:#ff7a1f; color:var(--c); border-color:var(--c); box-shadow:0 0 5px var(--c), inset 0 0 4px #000; }

.bit.active { opacity:.98; background:var(--c); box-shadow:0 0 8px var(--c), 0 0 18px var(--c), 0 0 34px var(--c); }
.bit.flash { background:#fff !important; border-color:#fff !important; box-shadow:0 0 12px #fff,0 0 28px #fff,0 0 56px #fff !important; opacity:1 !important; z-index:3; transform:scale(1.15); }
.bit.final { animation:sync 1.1s ease-in-out infinite; }
@keyframes sync { 0%,100%{ filter:brightness(1) } 50%{ filter:brightness(1.7) saturate(1.4) } }

#core {
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:144px; height:144px; border-radius:50%; z-index:15; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 30% 30%, #e8c6ff 0%, #b366ff 22%, #6a00d3 55%, #14001f 100%);
  border:3px solid #c585ff; box-shadow:0 0 20px #b366ff, 0 0 45px #b366ff, 0 0 85px #8a2eff, inset 0 0 28px #e1b8ff;
  animation:corePulse 2.1s ease-in-out infinite;
}
#core::before {
  content:''; position:absolute; inset:-22px; border-radius:50%;
  background:radial-gradient(circle, rgba(179,102,255,.45) 0%, transparent 65%);
  filter:blur(14px); z-index:-1;
}
.core-label { font-size:24px; line-height:1.05; text-align:center; color:#fff; text-shadow:0 0 7px #fff,0 0 16px #b366ff,0 0 32px #b366ff; letter-spacing:1px; }
@keyframes corePulse { 0%,100%{ transform:translate(-50%,-50%) scale(1) } 50%{ transform:translate(-50%,-50%) scale(1.06) } }
#core.explode { animation:none; transform:translate(-50%,-50%) scale(1.4); box-shadow:0 0 40px #ffd400,0 0 90px #b366ff,0 0 170px #b366ff,0 0 280px rgba(255,215,0,.55), inset 0 0 50px #fff8cc; }

#orb {
  position:absolute; width:28px; height:28px; border-radius:50%; left:410px; top:410px;
  transform:translate(-50%,-50%); z-index:25; background:#fff;
  box-shadow:0 0 12px #fff,0 0 26px #fff,0 0 42px #ff00ff,0 0 74px #00eaff;
  transition:left 1.2s cubic-bezier(.22,.85,.28,1), top 1.2s cubic-bezier(.22,.85,.28,1), transform .18s;
}
#orb::after {
  content:''; position:absolute; inset:-10px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(0,255,255,.45) 28%, transparent 70%);
  filter:blur(7px); z-index:-1;
}
#orb.red { background:#ff1242; box-shadow:0 0 14px #ff1242,0 0 30px #ff1242,0 0 56px #ff0033,0 0 95px #ff0033; }

#message {
  position:absolute; left:50%; top:44%; transform:translate(-50%,-50%) scale(.92);
  font-size:clamp(30px,7vw,92px); line-height:1; text-align:center; white-space:nowrap;
  color:#fff; opacity:0; z-index:80; pointer-events:none; letter-spacing:2px;
  text-shadow:0 0 12px #ff0044, 0 0 28px #ff0044, 0 0 56px #ff0044, 0 0 90px #ff0044;
  transition:opacity .24s, transform .24s;
}
#message.show { opacity:1; transform:translate(-50%,-50%) scale(1.06); }
#message.lock { text-shadow:0 0 14px #fff,0 0 30px #ffd700,0 0 60px #b366ff,0 0 110px #b366ff; color:#fffce6; }

#flash {
  position:absolute; inset:0; background:#fff; opacity:0; z-index:90; pointer-events:none; mix-blend-mode:screen; transition:opacity .18s;
}

body.shake17 #app { animation:shake 0.14s infinite; }
@keyframes shake { 0%{transform:translate(0,0)} 25%{transform:translate(-7px,5px)} 50%{transform:translate(6px,-4px)} 75%{transform:translate(-4px,6px)} 100%{transform:translate(0,0)} }

.arm-label { position:absolute; font-size:16px; opacity:.75; letter-spacing:2px; pointer-events:none; }
.arm.north .arm-label { top:-22px; left:50%; transform:translateX(-50%); color:#ff2a88; text-shadow:0 0 8px #ff2a88; }
.arm.south .arm-label { bottom:-22px; left:50%; transform:translateX(-50%); color:#1aff9c; text-shadow:0 0 8px #1aff9c; }
.arm.east .arm-label { right:-24px; top:50%; transform:translateY(-50%); color:#2098ff; text-shadow:0 0 8px #2098ff; }
.arm.west .arm-label { left:-24px; top:50%; transform:translateY(-50%); color:#ff7a1f; text-shadow:0 0 8px #ff7a1f; }

@media (max-width:600px){
  .hud { font-size:18px; padding:10px 14px; }
  #walkSequence span { min-width:14px; }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="bg"></canvas>
  <canvas id="fx"></canvas>
  <div class="vignette"></div>
  <div class="scanlines"></div>
  
  <header class="hud">
    <div class="hud-left">WALK: <span id="walkSequence"></span></div>
    <div class="hud-right">BITS: 128 = 4×32</div>
  </header>

  <div id="stage">
    <div id="cross">
      <div class="arm north" data-arm="N"><div class="arm-label">N</div></div>
      <div class="arm east" data-arm="E"><div class="arm-label">E</div></div>
      <div class="arm south" data-arm="S"><div class="arm-label">S</div></div>
      <div class="arm west" data-arm="W"><div class="arm-label">W</div></div>
      
      <div id="core"><div class="core-label">ROOT<br>0 = HUMAN</div></div>
      <div id="orb"></div>
    </div>
  </div>

  <div id="message"></div>
  <div id="flash"></div>
</div>

<script>
(() => {
  const sequence = [1,1,2,3,5,7,9,11,15,17,23];
  const steps = [
    {arm:'N', pos:1}, {arm:'E', pos:1}, {arm:'S', pos:2}, {arm:'W', pos:3},
    {arm:'N', pos:5}, {arm:'E', pos:7}, {arm:'S', pos:9}, {arm:'W', pos:11},
    {arm:'N', pos:15}, {arm:'W', pos:17}, {arm:'CENTER', pos:0}
  ];
  
  const cross = document.getElementById('cross');
  const orb = document.getElementById('orb');
  const core = document.getElementById('core');
  const message = document.getElementById('message');
  const flash = document.getElementById('flash');
  const walkEl = document.getElementById('walkSequence');
  
  const arms = { N:[], E:[], S:[], W:[] };
  
  // build bits
  ['north','east','south','west'].forEach(dir => {
    const el = document.querySelector('.arm.'+dir);
    const key = dir[0].toUpperCase();
    for(let i=1;i<=32;i++){
      const b=document.createElement('div');
      b.className='bit';
      b.dataset.pos=i;
      el.appendChild(b);
      arms[key].push(b);
    }
  });
  
  // walk HUD
  walkEl.innerHTML = sequence.map((v,i)=>`<span data-i="${i}">${v}</span>`).join('<span class="arrow">→</span>');
  function highlightWalk(i){
    walkEl.querySelectorAll('[data-i]').forEach(el=> el.classList.toggle('on', +el.dataset.i===i));
  }
  
  const bg = document.getElementById('bg');
  const bctx = bg.getContext('2d');
  const fx = document.getElementById('fx');
  const fctx = fx.getContext('2d');
  
  function drawGrid(){
    const w = bg.width = window.innerWidth;
    const h = bg.height = window.innerHeight;
    bctx.fillStyle = '#000003';
    bctx.fillRect(0,0,w,h);
    bctx.strokeStyle = 'rgba(0,230,255,0.07)';
    bctx.lineWidth = 1;
    const step = 44;
    bctx.beginPath();
    for(let x=0;x<w;x+=step){ bctx.moveTo(x,0); bctx.lineTo(x,h); }
    for(let y=0;y<h;y+=step){ bctx.moveTo(0,y); bctx.lineTo(w,y); }
    bctx.stroke();
    bctx.strokeStyle = 'rgba(255,0,170,0.05)';
    bctx.lineWidth = 1.5;
    bctx.beginPath();
    for(let x=0;x<w;x+=step*5){ bctx.moveTo(x,0); bctx.lineTo(x,h); }
    for(let y=0;y<h;y+=step*5){ bctx.moveTo(0,y); bctx.lineTo(w,y); }
    bctx.stroke();
    // radial glow
    const g = bctx.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h)*0.6);
    g.addColorStop(0,'rgba(80,0,120,0.18)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    bctx.fillStyle = g;
    bctx.fillRect(0,0,w,h);
  }
  
  function getPos(el){
    let x=0, y=0, node=el;
    while(node && node!==cross){
      x += node.offsetLeft;
      y += node.offsetTop;
      node = node.offsetParent;
    }
    x += el.offsetWidth/2;
    y += el.offsetHeight/2;
    return {x,y};
  }
  
  const sleep = ms => new Promise(r=>setTimeout(r,ms));
  
  function moveOrbTo(x,y,speed='1.2s'){
    orb.style.transition = `left ${speed} cubic-bezier(.22,.85,.28,1), top ${speed} cubic-bezier(.22,.85,.28,1)`;
    orb.style.left = x+'px';
    orb.style.top = y+'px';
  }
  function moveOrbToEl(el){
    const p = getPos(el);
    moveOrbTo(p.x, p.y, '1.2s');
  }
  function flashBit(arm,pos){
    const bit = arms[arm][pos-1];
    bit.classList.add('flash');
    setTimeout(()=>bit.classList.remove('flash'), 220);
  }
  function lightUpTo(arm,pos){
    for(let i=0;i<pos;i++) arms[arm][i].classList.add('active');
  }
  
  let particles = [];
  function initParticles(){
    particles = [];
    for(let i=0;i<75;i++){
      particles.push({
        x:Math.random()*window.innerWidth,
        y:Math.random()*window.innerHeight,
        vx:(Math.random()-0.5)*0.4,
        vy:(Math.random()-0.5)*0.4,
        size:Math.random()*1.6+0.4,
        hue:[300,195,330,145,280][Math.floor(Math.random()*5)],
        alpha:0.4+Math.random()*0.5,
        life:Infinity
      });
    }
  }
  
  function burstParticles(){
    const cx = window.innerWidth/2;
    const cy = window.innerHeight*0.5;
    for(let i=0;i<180;i++){
      const a = Math.random()*Math.PI*2;
      const sp = 1.8 + Math.random()*5.2;
      particles.push({
        x:cx, y:cy,
        vx:Math.cos(a)*sp,
        vy:Math.sin(a)*sp,
        size:1.5+Math.random()*3,
        hue: Math.random()<0.6?275:48,
        alpha:1,
        life:70+Math.random()*20
      });
    }
  }
  
  function animate(){
    fctx.clearRect(0,0,fx.width,fx.height);
    fctx.globalCompositeOperation = 'lighter';
    particles.forEach(p=>{
      p.x += p.vx;
      p.y += p.vy;
      if(p.life===Infinity){
        if(p.x<0||p.x>fx.width) p.vx*=-1;
        if(p.y<0||p.y>fx.height) p.vy*=-1;
      }else{
        p.vx*=0.98; p.vy*=0.98; p.life--; p.alpha*=0.982;
      }
      fctx.beginPath();
      fctx.arc(p.x,p.y,p.size,0,Math.PI*2);
      fctx.fillStyle = `hsla(${p.hue},100%,65%,${p.alpha})`;
      fctx.shadowColor = `hsl(${p.hue},100%,60%)`;
      fctx.shadowBlur = 14;
      fctx.fill();
    });
    particles = particles.filter(p=> p.life===Infinity || p.life>0);
    // orb trail
    const r = orb.getBoundingClientRect();
    const tx = r.left + r.width/2;
    const ty = r.top + r.height/2;
    fctx.beginPath();
    fctx.arc(tx,ty,16,0,7);
    fctx.fillStyle = 'rgba(255,255,255,0.07)';
    fctx.shadowColor = '#fff';
    fctx.shadowBlur = 22;
    fctx.fill();
    requestAnimationFrame(animate);
  }
  
  function updateScale(){
    const s = Math.min(window.innerWidth*0.94, window.innerHeight*0.82)/820;
    cross.style.transform = `scale(${Math.max(0.45, Math.min(s,1.18))})`;
  }
  
  function resizeAll(){
    bg.width = window.innerWidth; bg.height = window.innerHeight;
    fx.width = window.innerWidth; fx.height = window.innerHeight;
    drawGrid();
    updateScale();
    initParticles();
  }
  window.addEventListener('resize', resizeAll);
  
  async function trigger17(){
    cross.classList.add('dim');
    document.body.classList.add('shake17');
    message.textContent = '17 — WHO ARE YOU? (hesitate)';
    message.classList.add('show');
    orb.classList.add('red');
    for(let k=0;k<3;k++){
      orb.style.transform = 'translate(-50%,-50%) scale(1.9)';
      await sleep(210);
      orb.style.transform = 'translate(-50%,-50%) scale(1)';
      await sleep(210);
    }
    await sleep(1240);
    message.classList.remove('show');
    document.body.classList.remove('shake17');
    orb.classList.remove('red');
    cross.classList.remove('dim');
  }
  
  async function triggerLock(){
    flash.style.opacity = '1';
    setTimeout(()=>flash.style.opacity='0',140);
    core.classList.add('explode');
    message.textContent = '23 — WHO AM I? (LOCK)';
    message.classList.add('show','lock');
    ['N','E','S','W'].forEach(k=> arms[k].forEach(b=>{ b.classList.add('active','final'); }));
    burstParticles();
    await sleep(2200);
    message.classList.remove('show','lock');
    core.classList.remove('explode');
  }
  
  function reset(){
    ['N','E','S','W'].forEach(k=> arms[k].forEach(b=> b.classList.remove('active','flash','final')));
    orb.style.transition='none';
    moveOrbTo(410,410,'0s');
    orb.style.transform='translate(-50%,-50%)';
    orb.classList.remove('red');
    message.classList.remove('show','lock');
    cross.classList.remove('dim');
    document.body.classList.remove('shake17');
    core.classList.remove('explode');
  }
  
  async function run(){
    await sleep(600);
    while(true){
      reset();
      for(let i=0;i<steps.length;i++){
        highlightWalk(i);
        const step = steps[i];
        const val = sequence[i];
        
        if(step.arm==='CENTER'){
          moveOrbTo(410,410,'0.55s');
          await sleep(600);
          await triggerLock();
          await sleep(1200);
        }else{
          const bit = arms[step.arm][step.pos-1];
          moveOrbToEl(bit);
          await sleep(1200);
          flashBit(step.arm, step.pos);
          lightUpTo(step.arm, step.pos);
          
          if(val===17){
            await trigger17();
          }
        }
      }
      await sleep(1200);
    }
  }
  
  resizeAll();
  animate();
  run();
})();
</script>
</body>
</html>
