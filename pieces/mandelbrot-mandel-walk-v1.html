<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MAX MANDELBROT JOURNEY — 6×4×2×1×0=0</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  canvas { position:absolute; top:0; left:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  canvas:active { cursor:grabbing; }

  .hud { position:absolute; left:0; right:0; pointer-events:none; z-index:10; color:#e6f7ff; text-shadow:0 0 10px rgba(0,200,255,0.6); }
  .top { top:0; padding:18px 22px; text-align:center; font-size:clamp(12px,1.8vw,16px); letter-spacing:0.18em; text-transform:uppercase; opacity:0.9; background:linear-gradient(180deg, rgba(0,0,0,0.7), transparent); }
  .bottom { bottom:0; padding:16px; text-align:center; font-size:12px; letter-spacing:0.2em; opacity:0.7; background:linear-gradient(0deg, rgba(0,0,0,0.8), transparent); }

  .operation { position:absolute; top:64px; left:20px; z-index:11; display:flex; gap:10px; align-items:center; padding:12px 16px; background:rgba(5,10,15,0.55); border:1px solid rgba(0,200,255,0.25); border-radius:14px; backdrop-filter:blur(12px); box-shadow:0 0 30px rgba(0,180,255,0.15), inset 0 0 20px rgba(0,180,255,0.05); }
  .op-num { font-size:28px; font-weight:700; width:34px; text-align:center; color:#5a6b78; transition:all 0.5s ease; position:relative; }
  .op-num.active { color:#fff; text-shadow:0 0 12px #ff3b3b, 0 0 24px #ff3b3b, 0 0 40px #ff5e5e; transform:scale(1.15); }
  .op-num.active::after { content:''; position:absolute; inset:-6px; border-radius:8px; background:radial-gradient(circle, rgba(255,60,60,0.3), transparent 70%); z-index:-1; animation:pulse 1.5s infinite; }
  .operation span.sep { opacity:0.4; font-size:20px; }
  .operation .eq { margin-left:8px; font-size:20px; opacity:0.8; }

  @keyframes pulse { 0%,100%{opacity:0.6; transform:scale(1);} 50%{opacity:1; transform:scale(1.1);} }

  .coords { position:absolute; bottom:54px; left:20px; z-index:11; padding:10px 14px; background:rgba(0,0,0,0.55); border:1px solid rgba(0,200,255,0.2); border-radius:10px; font-size:11px; line-height:1.6; color:#a0dfff; backdrop-filter:blur(8px); pointer-events:none; }
  .coords b { color:#fff; }

  .controls { position:absolute; top:64px; right:20px; z-index:11; display:flex; gap:10px; }
  .btn { pointer-events:auto; padding:10px 16px; background:rgba(10,20,30,0.7); border:1px solid rgba(0,200,255,0.3); color:#cfffff; border-radius:10px; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; transition:all 0.2s; backdrop-filter:blur(10px); }
  .btn:hover { background:rgba(0,180,255,0.2); border-color:#0ff; box-shadow:0 0 15px rgba(0,200,255,0.4); }
  .btn.active { background:rgba(0,200,255,0.25); color:#fff; box-shadow:0 0 20px rgba(0,200,255,0.6); }

  #paradox { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.8); z-index:20; font-size:clamp(40px,10vw,120px); font-weight:900; color:#fff; text-shadow:0 0 20px #0ff, 0 0 40px #0ff, 0 0 80px #00ffff; opacity:0; pointer-events:none; transition:all 0.6s cubic-bezier(0.2,0.8,0.2,1); letter-spacing:0.05em; }
  #paradox.show { opacity:1; transform:translate(-50%,-50%) scale(1.1); }

  #closed { position:absolute; top:22%; left:50%; transform:translateX(-50%); z-index:19; padding:12px 24px; background:rgba(0,0,0,0.7); border:1px solid rgba(0,255,200,0.5); border-radius:30px; color:#7fffd4; font-size:14px; letter-spacing:0.3em; text-transform:uppercase; opacity:0; transition:opacity 1s; box-shadow:0 0 30px rgba(0,255,200,0.3); }
  #closed.visible { opacity:1; animation:glow 2s infinite alternate; }
  @keyframes glow { from{box-shadow:0 0 20px rgba(0,255,200,0.3);} to{box-shadow:0 0 40px rgba(0,255,200,0.7);} }

  #reticle { position:absolute; top:50%; left:50%; width:140px; height:140px; transform:translate(-50%,-50%); z-index:5; pointer-events:none; opacity:0.55; mix-blend-mode:screen; }
  #reticle .cross-h, #reticle .cross-v { position:absolute; background:linear-gradient(90deg, transparent, rgba(0,255,255,0.8), transparent); }
  #reticle .cross-h { top:50%; left:0; width:100%; height:1px; box-shadow:0 0 8px #0ff; }
  #reticle .cross-v { left:50%; top:0; width:1px; height:100%; background:linear-gradient(0deg, transparent, rgba(0,255,255,0.8), transparent); box-shadow:0 0 8px #0ff; }
  #reticle .r { position:absolute; font-size:13px; color:#7fffd4; text-shadow:0 0 6px #0ff; font-weight:600; }
  #reticle .c { left:50%; top:50%; transform:translate(-50%,-50%); font-size:16px; color:#fff; }
  #reticle .t { left:50%; top:8px; transform:translateX(-50%); }
  #reticle .b { left:50%; bottom:8px; transform:translateX(-50%); }
  #reticle .l { left:8px; top:50%; transform:translateY(-50%); }
  #reticle .rgt { right:8px; top:50%; transform:translateY(-50%); }

  #quorum { position:absolute; inset:0; z-index:6; pointer-events:none; }
  .qdot { position:absolute; width:8px; height:8px; margin:-4px 0 0 -4px; border-radius:50%; background:radial-gradient(circle, #fff, #0ff 40%, transparent 70%); box-shadow:0 0 10px #0ff, 0 0 20px #0ff, 0 0 30px rgba(0,255,255,0.5); opacity:0.85; animation:twinkle 3s infinite; }
  .qdot::after { content:''; position:absolute; inset:-6px; border:1px solid rgba(0,255,255,0.3); border-radius:50%; animation:ping 2.5s infinite; }
  @keyframes twinkle { 0%,100%{opacity:0.7; transform:scale(1);} 50%{opacity:1; transform:scale(1.3);} }
  @keyframes ping { 0%{transform:scale(0.6); opacity:0.8;} 100%{transform:scale(2); opacity:0;} }

  .marker { position:absolute; z-index:12; padding:6px 10px; background:rgba(0,0,0,0.75); border:1px solid rgba(255,100,100,0.5); border-radius:8px; color:#ffcaca; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; pointer-events:none; opacity:0; transform:translateY(10px); transition:all 0.4s; white-space:nowrap; }
  .marker.show { opacity:1; transform:translateY(0); }

  @media (max-width:700px){
    .operation { top:auto; bottom:110px; left:50%; transform:translateX(-50%); padding:8px 12px; }
    .op-num { font-size:22px; width:26px; }
    .controls { top:auto; bottom:64px; right:50%; transform:translateX(50%); }
    .coords { bottom:auto; top:120px; left:10px; right:10px; font-size:10px; text-align:center; }
    .top { font-size:11px; padding:12px; }
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="hud top">MAX MANDELBROT JOURNEY — Walking the infinite</div>
<div class="hud bottom">6×4×2×1×0=0 | 1=0=1 | each point audits the whole</div>

<div class="operation">
  <span class="op-num" id="op6">6</span><span class="sep">×</span>
  <span class="op-num" id="op4">4</span><span class="sep">×</span>
  <span class="op-num" id="op2">2</span><span class="sep">×</span>
  <span class="op-num" id="op1">1</span><span class="sep">×</span>
  <span class="op-num" id="op0">0</span>
  <span class="eq">= 0</span>
</div>

<div class="controls">
  <button class="btn" id="walkBtn">WALK</button>
  <button class="btn" id="resetBtn">RESET</button>
</div>

<div class="coords" id="coords">
  <div>ZOOM: <b id="zoom">1×</b> | ITER: <b id="iter">200</b></div>
  <div>Re: <b id="re">-0.5</b></div>
  <div>Im: <b id="im">0</b></div>
</div>

<div id="reticle">
  <div class="cross-h"></div>
  <div class="cross-v"></div>
  <span class="r c">0</span>
  <span class="r t">00</span>
  <span class="r b">00</span>
  <span class="r l">00</span>
  <span class="r rgt">00</span>
</div>

<div id="quorum"></div>
<div id="paradox">1=0=1</div>
<div id="closed">FRACTAL CLOSED</div>

<div class="marker" id="m6" style="left:22%; top:35%;">6 BULBS — main cardioid</div>
<div class="marker" id="m4" style="left:65%; top:28%;">4 QUADRANTS</div>
<div class="marker" id="m2" style="left:72%; top:68%;">2 — duality</div>
<div class="marker" id="m1" style="left:30%; top:72%;">1 — mini copy</div>
<div class="marker" id="m0" style="left:50%; top:15%;">0 — zero point</div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const gl = canvas.getContext('webgl', { preserveDrawingBuffer:false, antialias:false });
  if(!gl){ alert('WebGL required'); return; }

  const vs = `attribute vec2 a; void main(){gl_Position=vec4(a,0.,1.);}`;
  const fs = `precision highp float;
uniform vec2 R; uniform vec2 Cx; uniform vec2 Cy; uniform vec2 S; uniform int I; uniform float H;
const float SPL=4097.0;
vec2 sf(float a){float t=a*SPL; float h=t-(t-a); float l=a-h; return vec2(h,l);}
vec2 ts(float a,float b){float s=a+b; float v=s-a; float e=(a-(s-v))+(b-v); return vec2(s,e);}
vec2 qs(float a,float b){float s=a+b; float e=b-(s-a); return vec2(s,e);}
vec2 ad(vec2 a,vec2 b){vec2 s=ts(a.x,b.x); s.y+=a.y+b.y; return qs(s.x,s.y);}
vec2 sb(vec2 a,vec2 b){vec2 s=ts(a.x,-b.x); s.y+=a.y-b.y; return qs(s.x,s.y);}
vec2 tp(float a,float b){float p=a*b; vec2 a2=sf(a); vec2 b2=sf(b); float e=((a2.x*b2.x-p)+a2.x*b2.y+a2.y*b2.x)+a2.y*b2.y; return vec2(p,e);}
vec2 ml(vec2 a,vec2 b){vec2 p=tp(a.x,b.x); p.y+=a.x*b.y+a.y*b.x; return qs(p.x,p.y);}
vec2 st(float a){return vec2(a,0.);}
void main(){
  float nx=(gl_FragCoord.x-0.5*R.x)/R.y;
  float ny=(gl_FragCoord.y-0.5*R.y)/R.y;
  vec2 cx=ad(Cx, ml(st(nx), S));
  vec2 cy=ad(Cy, ml(st(ny), S));
  vec2 zx=vec2(0.); vec2 zy=vec2(0.);
  int i=0;
  for(int n=0;n<3000;n++){
    if(n>=I) break;
    vec2 zx2=ml(zx,zx); vec2 zy2=ml(zy,zy); vec2 xy=ml(zx,zy); xy=ad(xy,xy);
    if(ad(zx2,zy2).x>4.0){i=n; break;}
    zx=ad(sb(zx2,zy2), cx); zy=ad(xy, cy); i=n;
  }
  float t=float(i)/float(I);
  vec3 col;
  if(i>=I-1){ col=vec3(0.); }
  else{
    vec3 a=mix(vec3(0.), vec3(1.0,0.12,0.04), pow(t,0.28));
    a=mix(a, vec3(1.,0.93,0.8), pow(t,3.5));
    vec3 b=mix(vec3(0.,0.,0.03), vec3(0.,0.55,1.), pow(t,0.33));
    b=mix(b, vec3(0.65,1.,1.), pow(t,4.5));
    col=mix(a,b,clamp(H,0.,1.));
    col*=0.85+0.15*sin(t*80.+H*6.283);
    col+=0.05*pow(1.-t,8.);
  }
  gl_FragColor=vec4(col,1.);
}`;
  function compile(t,src){ const s=gl.createShader(t); gl.shaderSource(s,src); gl.compileShader(s); if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; }
  const prog=gl.createProgram(); gl.attachShader(prog,compile(gl.VERTEX_SHADER,vs)); gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(prog); gl.useProgram(prog);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const locA=gl.getAttribLocation(prog,'a'); gl.enableVertexAttribArray(locA); gl.vertexAttribPointer(locA,2,gl.FLOAT,false,0,0);
  const uR=gl.getUniformLocation(prog,'R'), uCx=gl.getUniformLocation(prog,'Cx'), uCy=gl.getUniformLocation(prog,'Cy'), uS=gl.getUniformLocation(prog,'S'), uI=gl.getUniformLocation(prog,'I'), uH=gl.getUniformLocation(prog,'H');

  let cx=-0.5, cy=0, scale=1.75; const initScale=1.75;
  let maxIter=200, needs=true, quality=0.85, dpr=Math.min(window.devicePixelRatio||1,1.5);
  let walk=false, targetIdx=0;

  const quorumPts=[
    {x:-0.75,y:0},{x:-0.745428,y:0.113009},{x:-0.75,y:0.1},{x:0.275,y:0.48},
    {x:-0.1592,y:1.0408},{x:-1.749,y:0},{x:-0.1011,y:0.9563},{x:0.338,y:0.624},
    {x:-0.7269,y:0.1889},{x:-0.8,y:0.156},{x:-0.761574,y:0.083759},{x:-0.16,y:1.04}
  ];
  const quorumDiv=document.getElementById('quorum');
  quorumPts.forEach(()=>{ const d=document.createElement('div'); d.className='qdot'; quorumDiv.appendChild(d); });

  const minibrots=[
    {x:-0.745428,y:0.113009},{x:-0.748,y:0.1},{x:0.27496,y:0.482},
    {x:-1.749665,y:0},{x:-0.16,y:1.0408},{x:-0.1011,y:0.956},
    {x:-0.75,y:0.02}
  ];

  function split(v){ const hi=Math.fround(v); return [hi, v-hi]; }

  function resize(){
    const w=canvas.clientWidth, h=canvas.clientHeight;
    canvas.width=Math.floor(w*quality*dpr); canvas.height=Math.floor(h*quality*dpr);
    gl.viewport(0,0,canvas.width,canvas.height); needs=true;
  }

  function render(){
    gl.useProgram(prog);
    gl.uniform2f(uR, canvas.width, canvas.height);
    const sx=split(cx), sy=split(cy), ss=split(scale);
    gl.uniform2f(uCx, sx[0], sx[1]); gl.uniform2f(uCy, sy[0], sy[1]); gl.uniform2f(uS, ss[0], ss[1]);
    gl.uniform1i(uI, maxIter);
    const zoom=initScale/scale;
    const hue=Math.min(1, Math.log10(zoom+1)/4);
    gl.uniform1f(uH, hue);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }

  function updateUI(){
    const zoom=initScale/scale;
    document.getElementById('zoom').textContent = zoom>=1e4? zoom.toExponential(1)+'×' : (zoom>=100? Math.round(zoom)+'×' : zoom.toFixed(1)+'×');
    document.getElementById('iter').textContent = maxIter;
    document.getElementById('re').textContent = cx.toPrecision(13);
    document.getElementById('im').textContent = cy.toPrecision(13);

    ['op6','op4','op2','op1','op0'].forEach(id=>document.getElementById(id).classList.remove('active'));
    if(zoom>=1) document.getElementById('op6').classList.add('active');
    if(zoom>=10) document.getElementById('op4').classList.add('active');
    if(zoom>=100) document.getElementById('op2').classList.add('active');
    if(zoom>=1000) document.getElementById('op1').classList.add('active');
    if(zoom>=10000) document.getElementById('op0').classList.add('active');

    const markers={m6:1,m4:10,m2:100,m1:1000,m0:10000};
    for(const [id,z] of Object.entries(markers)){
      const el=document.getElementById(id);
      if(Math.abs(Math.log10(zoom)-Math.log10(z))<0.15) el.classList.add('show'); else el.classList.remove('show');
    }

    document.getElementById('closed').classList.toggle('visible', zoom>12000);

    // quorum positions
    const dots=quorumDiv.children;
    const w=canvas.clientWidth, h=canvas.clientHeight;
    for(let i=0;i<quorumPts.length;i++){
      const p=quorumPts[i]; const d=dots[i];
      const sx = (p.x - cx)/scale * h + w/2;
      const sy = h/2 - (p.y - cy)/scale * h;
      const vis = sx>-20 && sx<w+20 && sy>-20 && sy<h+20 && zoom>0.8 && zoom<5000;
      d.style.left=sx+'px'; d.style.top=sy+'px'; d.style.opacity=vis? '0.9':'0';
    }

    // paradox trigger
    if(zoom>300){
      for(const mb of minibrots){
        const dist=Math.hypot(cx-mb.x, cy-mb.y);
        if(dist < scale*0.25){ triggerParadox(); break; }
      }
    }
  }

  let paradoxLock=false;
  function triggerParadox(){
    if(paradoxLock) return; paradoxLock=true;
    const el=document.getElementById('paradox'); el.classList.add('show');
    setTimeout(()=>el.classList.remove('show'), 1200);
    setTimeout(()=>paradoxLock=false, 2500);
  }

  // interactions
  let dragging=false, lx=0, ly=0, lastDist=0;
  canvas.addEventListener('mousedown',e=>{ dragging=true; lx=e.clientX; ly=e.clientY; quality=0.6; resize(); });
  window.addEventListener('mouseup',()=>{ dragging=false; setTimeout(()=>{quality=0.9; resize();},300); });
  window.addEventListener('mousemove',e=>{
    if(!dragging) return;
    const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
    cx -= dx / canvas.clientHeight * scale * 2;
    cy += dy / canvas.clientHeight * scale * 2;
    maxIter = Math.min(2500, 180 + Math.floor(400*Math.log10(initScale/scale+1)));
    needs=true;
  });
  canvas.addEventListener('wheel',e=>{
    e.preventDefault();
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    const nx=(mx - rect.width/2)/rect.height, ny=(rect.height/2 - my)/rect.height;
    const wx=cx + nx*scale*2, wy=cy + ny*scale*2;
    const factor=Math.exp(e.deltaY*0.0012);
    scale = Math.max(1e-14, Math.min(3, scale*factor));
    cx = wx - nx*scale*2; cy = wy - ny*scale*2;
    maxIter = Math.min(2800, 180 + Math.floor(450*Math.log10(initScale/scale+1)));
    quality=0.65; resize(); needs=true;
  },{passive:false});

  // touch
  canvas.addEventListener('touchstart',e=>{
    if(e.touches.length===1){ dragging=true; lx=e.touches[0].clientX; ly=e.touches[0].clientY; quality=0.6; resize(); }
    else if(e.touches.length===2){ lastDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); }
  },{passive:true});
  canvas.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(e.touches.length===1 && dragging){
      const dx=e.touches[0].clientX-lx, dy=e.touches[0].clientY-ly; lx=e.touches[0].clientX; ly=e.touches[0].clientY;
      cx -= dx / canvas.clientHeight * scale * 2; cy += dy / canvas.clientHeight * scale * 2; needs=true;
    } else if(e.touches.length===2){
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      if(lastDist>0){ const f=d/lastDist; scale=Math.max(1e-14,scale/f); needs=true; } lastDist=d;
    }
  },{passive:false});
  window.addEventListener('touchend',()=>{ dragging=false; lastDist=0; setTimeout(()=>{quality=0.9; resize();},300); });

  document.getElementById('resetBtn').onclick=()=>{ cx=-0.5; cy=0; scale=1.75; maxIter=200; walk=false; document.getElementById('walkBtn').classList.remove('active'); needs=true; };
  document.getElementById('walkBtn').onclick=(e)=>{ walk=!walk; e.target.classList.toggle('active',walk); };

  function walkStep(){
    if(!walk) return;
    const t=minibrots[targetIdx%minibrots.length];
    cx += (t.x - cx)*0.015;
    cy += (t.y - cy)*0.015;
    scale *= 0.992;
    if(Math.hypot(cx-t.x, cy-t.y) < scale*0.5) targetIdx++;
    if(scale<5e-14){ scale=1.2; targetIdx++; }
    maxIter = Math.min(2600, 200 + Math.floor(380*Math.log10(initScale/scale+1)));
    needs=true;
  }

  function loop(){
    walkStep();
    if(needs){ render(); needs=false; }
    updateUI();
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize',()=>{ resize(); });
  resize(); loop();

  // initial pop
  setTimeout(triggerParadox, 1800);
})();
</script>
</body>
</html>
