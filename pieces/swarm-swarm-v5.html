<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>AGI Federation – 17 Node Working Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
:root{--bg:#040506;--panel:#0a1015;--text:#d1d5db;--muted:#6b7280;--blue:#3b82f6;--green:#10b981;--amber:#f59e0b;--purple:#a855f7;--cyan:#06b6d4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,monospace;overflow:hidden}
header{padding:10px;text-align:center;font-weight:700;letter-spacing:1.5px;color:#7dd3fc;border-bottom:1px solid #1f2937}
.wrap{display:grid;grid-template-columns:1fr 380px;gap:12px;padding:12px;height:calc(100vh - 50px)}
.left{display:grid;grid-template-rows:auto 1fr;gap:12px}
.groups{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.group{background:var(--panel);border:1px solid #1f2937;border-radius:10px;padding:8px}
.group h3{margin:0 0 6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.swarm-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.cell{aspect-ratio:1;background:#111827;border-radius:3px;position:relative;cursor:pointer;transition:transform .12s}
.cell:hover{transform:scale(1.08);z-index:2;outline:1px solid #38bdf8}
.cell .hash{position:absolute;bottom:2px;right:2px;font-size:7px;color:#000;background:#fff9;padding:1px 2px;border-radius:2px;opacity:.85}
.judges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.judge{background:var(--panel);border:1px solid #1f2937;border-radius:10px;padding:8px;text-align:center}
.judge .root{font-family:monospace;font-size:10px;color:#67e8f9;word-break:break-all}
.right{background:var(--panel);border:1px solid #1f2937;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.meta{border:1px solid #164e63;border-radius:8px;padding:8px;background:#082f49;text-align:center}
.meta .root{font-family:monospace;font-size:11px;color:#a5f3fc}
.controls{display:flex;gap:6px}
.controls button{flex:1;background:#1f2937;border:1px solid #374151;color:var(--text);padding:6px;border-radius:6px;cursor:pointer;font-size:11px}
.controls button:hover{background:#374151}
textarea{width:100%;height:60px;background:#0b1120;border:1px solid #1f2937;color:var(--text);border-radius:6px;padding:6px;font-family:inherit;font-size:11px;resize:none}
.log{flex:1;background:#020617;border:1px solid #1f2937;border-radius:6px;padding:6px;font-size:10px;overflow:auto;white-space:pre-wrap}
.tooltip{position:fixed;pointer-events:none;background:#0b1120;border:1px solid #38bdf8;border-radius:6px;padding:8px;font-size:10px;max-width:320px;max-height:240px;overflow:auto;z-index:9999;box-shadow:0 10px 30px #000a;display:none}
.tooltip pre{margin:0;font-family:monospace;font-size:9px;line-height:1.3}
</style>
</head>
<body>
<header>AGI FEDERATION – 16 SWARMS × 25 INSTANCES – REAL MERKLE OVERLAY</header>
<div class="wrap">
  <div class="left">
    <div class="groups" id="groups"></div>
    <div class="judges" id="judges"></div>
  </div>
  <div class="right">
    <div class="meta">
      <div style="font-size:10px;color:#67e8f9;margin-bottom:4px">META JUDGE (17-NODE CONSENSUS)</div>
      <div class="root" id="metaRoot">-</div>
      <div id="metaStatus" style="font-size:10px;margin-top:4px;color:#fcd34d">IDLE</div>
    </div>
    <textarea id="probeText">Recursive self-improving memory should maintain coherence across parallel instances without central control.</textarea>
    <div class="controls">
      <button id="btnProbe">PROBE ALL</button>
      <button id="btnAuto">AUTO: OFF</button>
      <button id="btnDiverge">DIVERGE</button>
      <button id="btnReset">RESET</button>
    </div>
    <div class="log" id="log"></div>
  </div>
</div>
<div class="tooltip" id="tooltip"></div>
<script>
async function sha256hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
class MerkleNode{
  constructor(data, left=null, right=null){
    this.data=data; this.left=left; this.right=right; this.hash='';
  }
  async compute(){
    const leftHash = this.left ? await this.left.compute() : '';
    const rightHash = this.right ? await this.right.compute() : '';
    this.hash = await sha256hex(leftHash + rightHash + JSON.stringify(this.data));
    return this.hash;
  }
}
class RecursiveMemory{
  constructor(){ this.leaves=[]; this.root=null; }
  async add(data){
    const node = new MerkleNode(data);
    await node.compute();
    this.leaves.push(node);
    if(this.leaves.length>64) this.leaves.shift();
    await this.rebuild();
  }
  async rebuild(){
    let nodes = [...this.leaves];
    if(nodes.length===0){ this.root=null; return; }
    while(nodes.length>1){
      const next=[];
      for(let i=0;i<nodes.length;i+=2){
        if(i+1 < nodes.length){
          const parent = new MerkleNode('P', nodes[i], nodes[i+1]);
          await parent.compute();
          next.push(parent);
        }else{ next.push(nodes[i]); }
      }
      nodes = next;
    }
    this.root = nodes[0];
  }
  getRoot(){ return this.root ? this.root.hash : '0'.repeat(64); }
}
class Instance{
  constructor(id){ this.id=id; this.mem=new RecursiveMemory(); }
  async probe(text){ await this.mem.add({t:Date.now(),text}); return this.mem.getRoot(); }
}
class Swarm{
  constructor(id){ this.id=id; this.instances=Array.from({length:25},(_,i)=>new Instance(i)); }
  async probe(text){ const roots = await Promise.all(this.instances.map(inst=>inst.probe(text))); return await sha256hex(roots.join('')); }
  getRoots(){ return this.instances.map(i=>i.mem.getRoot()); }
}
const swarms = Array.from({length:16}, (_,i)=>new Swarm(i));
const judges = [0,1,2,3].map(j=>({id:j, roots:[null,null,null,null]}));
let meta = {root:'-', status:'IDLE'};

const groupsEl = document.getElementById('groups');
const judgesEl = document.getElementById('judges');
const metaRootEl = document.getElementById('metaRoot');
const metaStatusEl = document.getElementById('metaStatus');
const logEl = document.getElementById('log');
const tooltip = document.getElementById('tooltip');

// Build UI
['A','B','C','D'].forEach((g,gi)=>{
  const div = document.createElement('div'); div.className='group';
  div.innerHTML = `<h3>Group ${g}</h3><div class="swarm-grid" id="grid${gi}"></div>`;
  groupsEl.appendChild(div);
  const grid = div.querySelector('.swarm-grid');
  for(let s=0;s<4;s++){
    const swarmIdx = gi*4 + s;
    for(let i=0;i<25;i++){
      const cell = document.createElement('div'); cell.className='cell';
      cell.dataset.swarm = swarmIdx; cell.dataset.inst = i;
      const hash = document.createElement('div'); hash.className='hash'; hash.textContent='----';
      cell.appendChild(hash);
      grid.appendChild(cell);
      cell.addEventListener('mouseenter', e=>showTooltip(e, swarmIdx, i));
      cell.addEventListener('mouseleave', ()=>tooltip.style.display='none');
    }
  }
});
[0,1,2,3].forEach(j=>{
  const d = document.createElement('div'); d.className='judge';
  d.innerHTML = `<div style="font-size:10px;color:#9ca3af">JUDGE ${String.fromCharCode(65+j)}</div><div class="root" id="jroot${j}">-</div><div id="jstat${j}" style="font-size:9px;color:#9ca3af;margin-top:4px">-</div>`;
  judgesEl.appendChild(d);
});

function log(msg){ logEl.textContent = `[${new Date().toLocaleTimeString()}] ${msg}
` + logEl.textContent; }

async function tick(probeText){
  // 1. Probe all swarms
  const swarmRoots = await Promise.all(swarms.map(s=>s.probe(probeText)));
  // Update cells
  swarmRoots.forEach((root, si)=>{
    const roots = swarms[si].getRoots();
    roots.forEach((r,i)=>{
      const gi = Math.floor(si/4);
      const grid = document.getElementById('grid'+gi);
      const cell = grid.children[(si%4)*25 + i];
      cell.style.background = '#'+r.slice(0,6);
      cell.querySelector('.hash').textContent = r.slice(0,4);
    });
  });
  // 2. Judges
  const judgeOut = [];
  for(let j=0;j<4;j++){
    const slice = swarmRoots.slice(j*4, (j+1)*4);
    judges[j].roots = slice;
    const counts = {}; slice.forEach(r=>counts[r]=(counts[r]||0)+1);
    const max = Math.max(...Object.values(counts));
    const status = max>=3 ? 'ACCEPT' : max===2 ? 'SPLIT' : 'MEDIATE';
    const mediated = await sha256hex(slice.join(''));
    judgeOut.push(mediated);
    document.getElementById('jroot'+j).textContent = mediated.slice(0,12);
    document.getElementById('jstat'+j).textContent = `${max}/4 ${status}`;
  }
  // 3. Meta (4 judges + cortex simulated)
  const cortexRoot = await sha256hex('CORTEX'+probeText);
  const metaRoots = [...judgeOut, cortexRoot];
  const uniq = new Set(metaRoots);
  const consensus = 5 - uniq.size + 1;
  meta.root = await sha256hex(metaRoots.join(''));
  meta.status = consensus>=3 ? 'HOLD' : consensus===2 ? 'SPLIT' : 'VIOLATE';
  metaRootEl.textContent = meta.root;
  metaStatusEl.textContent = `${meta.status} (${consensus}/5)`;
  log(`Probe → meta=${meta.root.slice(0,8)} ${meta.status}`);
}

function showTooltip(e, swarmIdx, instIdx){
  const inst = swarms[swarmIdx].instances[instIdx];
  const root = inst.mem.root;
  let html = `<b>Swarm ${swarmIdx} / Inst ${instIdx}</b><br>Root: ${inst.mem.getRoot().slice(0,16)}…<br>Leaves: ${inst.mem.leaves.length}<pre>`;
  function walk(n,d=0){ if(!n) return; html += ' '.repeat(d*2) + (n.left||n.right?'├─':'└─') + n.hash.slice(0,6) + ' ' + JSON.stringify(n.data).slice(0,24) + '
'; if(n.left) walk(n.left,d+1); if(n.right) walk(n.right,d+1); }
  walk(root);
  html += '</pre>';
  tooltip.innerHTML = html;
  tooltip.style.left = (e.clientX+12)+'px';
  tooltip.style.top = (e.clientY+12)+'px';
  tooltip.style.display = 'block';
}

document.getElementById('btnProbe').onclick = ()=>tick(document.getElementById('probeText').value);
let auto=null;
document.getElementById('btnAuto').onclick = e=>{
  if(auto){ clearInterval(auto); auto=null; e.target.textContent='AUTO: OFF'; }
  else{ auto=setInterval(()=>tick(document.getElementById('probeText').value),1500); e.target.textContent='AUTO: ON'; }
};
document.getElementById('btnDiverge').onclick = async ()=>{
  const idx = Math.floor(Math.random()*16);
  await swarms[idx].probe('DIVERGE_'+Math.random());
  await tick('DIVERGE');
  log(`Forced divergence on swarm ${idx}`);
};
document.getElementById('btnReset').onclick = ()=>location.reload();

// Initial tick
tick('INIT');
</script>
</body>
</html>
