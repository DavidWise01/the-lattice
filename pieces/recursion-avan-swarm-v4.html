<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWARM OS v1.0 — 100-Agent Recursive Memory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #030509;
  --panel: #090d14;
  --panel-2: #0f1520;
  --panel-3: #141b28;
  --border: #1c2533;
  --border-light: #263244;
  --text: #e2e8f0;
  --text-dim: #7c8a9c;
  --text-faint: #4b5563;
  --cyan: #00e5ff;
  --blue: #3b82f6;
  --amber: #f5a524;
  --green: #10b981;
  --red: #ef4444;
  --purple: #8b5cf6;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  background: 
    radial-gradient(1000px 600px at 50% -100px, rgba(0,229,255,0.06), transparent 60%),
    radial-gradient(800px 400px at 90% 20%, rgba(139,92,246,0.04), transparent 50%),
    var(--bg);
}
.topbar {
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: rgba(9,13,20,0.8);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 100;
}
.topbar-left { display: flex; align-items: center; gap: 16px; }
.logo {
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 500;
  font-size: 13px;
  letter-spacing: 0.5px;
  color: var(--text);
  display: flex; align-items: center; gap: 8px;
}
.logo-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 10px rgba(0,229,255,0.6);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
.status {
  display: flex; align-items: center; gap: 14px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
}
.status-item { display: flex; align-items: center; gap: 6px; }
.status-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); }
.status-dot.amber { background: var(--amber); box-shadow: 0 0 6px rgba(245,165,36,0.5); }

.layout {
  display: grid;
  grid-template-columns: 280px 1fr 320px;
  flex: 1;
  min-height: 0;
  gap: 1px;
  background: var(--border);
}
.panel {
  background: var(--panel);
  display: flex;
  flex-direction: column;
  min-height: 0;
  position: relative;
}
.panel-header {
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  background: var(--panel-2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-faint);
  font-weight: 500;
}
.panel-content { flex: 1; min-height: 0; overflow: hidden; position: relative; }

/* LEFT PANEL - Memory Graph */
#memory-canvas { width: 100%; height: 240px; display: block; background: #070b12; cursor: crosshair; }
.concepts {
  padding: 8px;
  overflow-y: auto;
  height: calc(100% - 240px);
}
.concept {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 8px;
  margin-bottom: 2px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s;
  border: 1px solid transparent;
}
.concept:hover { background: var(--panel-3); border-color: var(--border-light); }
.concept.active { background: rgba(0,229,255,0.08); border-color: rgba(0,229,255,0.3); }
.concept-name { font-size: 12px; color: var(--text); }
.concept-count {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
  background: var(--panel-3);
  padding: 1px 5px;
  border-radius: 3px;
  min-width: 22px;
  text-align: center;
}
.concept.active .concept-count { color: var(--cyan); }

/* CENTER - Workbench */
.workbench { display: flex; flex-direction: column; height: 100%; }
.modes {
  display: flex;
  gap: 1px;
  background: var(--border);
  padding: 0;
  flex-shrink: 0;
}
.mode {
  flex: 1;
  padding: 10px;
  background: var(--panel-2);
  border: none;
  color: var(--text-dim);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.mode:hover { color: var(--text); background: var(--panel-3); }
.mode.active {
  color: var(--cyan);
  background: var(--panel);
}
.mode.active::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0;
  height: 2px; background: var(--cyan); box-shadow: 0 0 8px rgba(0,229,255,0.5);
}
.mode-desc {
  display: block;
  font-size: 9px;
  color: var(--text-faint);
  text-transform: none;
  letter-spacing: 0;
  margin-top: 2px;
  font-family: 'Inter', sans-serif;
}
.mode.active .mode-desc { color: rgba(0,229,255,0.7); }

.output {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.output::-webkit-scrollbar { width: 6px; }
.output::-webkit-scrollbar-track { background: transparent; }
.output::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }

.msg {
  animation: slideIn 0.3s ease-out;
}
@keyframes slideIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.msg-user {
  align-self: flex-end;
  background: var(--panel-3);
  border: 1px solid var(--border-light);
  padding: 8px 12px;
  border-radius: 8px 8px 2px 8px;
  max-width: 80%;
  font-size: 13px;
  color: var(--text);
}
.msg-system {
  background: rgba(14,22,33,0.6);
  border: 1px solid var(--border);
  border-left: 2px solid var(--text-faint);
  padding: 10px 12px;
  border-radius: 4px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
  line-height: 1.6;
}
.msg-answer {
  background: linear-gradient(180deg, rgba(0,229,255,0.06), transparent);
  border: 1px solid rgba(0,229,255,0.15);
  border-radius: 6px;
  overflow: hidden;
}
.answer-main {
  padding: 14px 16px;
  font-size: 18px;
  font-weight: 500;
  color: var(--text);
  letter-spacing: -0.2px;
}
.answer-meta {
  padding: 8px 16px;
  background: rgba(0,0,0,0.3);
  border-top: 1px solid rgba(0,229,255,0.1);
  display: flex; gap: 16px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--text-faint);
}
.answer-meta span { display: flex; align-items: center; gap: 5px; }
.answer-meta b { color: var(--cyan); font-weight: 500; }

.msg-build {
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  background: var(--panel-2);
}
.build-header {
  padding: 10px 14px;
  background: var(--panel-3);
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.build-title { font-weight: 500; font-size: 13px; }
.build-meta { font-family: 'IBM Plex Mono'; font-size: 10px; color: var(--text-dim); }
.build-preview {
  height: 280px;
  background: white;
  position: relative;
}
.build-preview iframe { width: 100%; height: 100%; border: none; background: white; }
.build-log {
  padding: 8px 12px;
  font-family: 'IBM Plex Mono';
  font-size: 10px;
  color: var(--text-faint);
  background: #070b12;
  border-top: 1px solid var(--border);
  max-height: 80px;
  overflow-y: auto;
}

.msg-dream {
  border: 1px solid rgba(139,92,246,0.2);
  background: linear-gradient(180deg, rgba(139,92,246,0.06), transparent);
  border-radius: 6px;
  padding: 14px;
}
.dream-title {
  font-size: 14px; font-weight: 500; color: var(--purple); margin-bottom: 8px;
  display: flex; align-items: center; gap: 8px;
}
.dream-content { font-size: 13px; line-height: 1.6; color: var(--text); }
.dream-sources {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid rgba(139,92,246,0.15);
  font-family: 'IBM Plex Mono'; font-size: 10px; color: var(--text-faint);
}

.input-bar {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: var(--panel-2);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.input-main {
  flex: 1;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  color: var(--text);
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  outline: none;
  transition: all 0.2s;
}
.input-main:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0,229,255,0.1); }
.input-main::placeholder { color: var(--text-faint); }
.btn {
  padding: 0 16px;
  background: var(--cyan);
  color: #001e26;
  border: none;
  border-radius: 6px;
  font-weight: 500;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Inter', sans-serif;
}
.btn:hover { background: #00c8e6; box-shadow: 0 0 12px rgba(0,229,255,0.3); }
.btn:active { transform: scale(0.98); }

/* RIGHT PANEL - Lattice */
.lattice-wrap { padding: 12px; }
.lattice {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 4px;
  padding: 8px;
  background: #070b12;
  border: 1px solid var(--border);
  border-radius: 6px;
}
.agent {
  aspect-ratio: 1;
  background: #0c121e;
  border: 1px solid #1a2433;
  border-radius: 2px;
  transition: all 0.3s;
  cursor: pointer;
  position: relative;
}
.agent:hover { border-color: var(--cyan); z-index: 10; }
.agent.idle { animation: idle 4s infinite; }
@keyframes idle { 0%,90%,100% { opacity: 1; } 95% { opacity: 0.6; } }
.agent.search { background: #0a2a3a; border-color: var(--cyan); box-shadow: 0 0 8px rgba(0,229,255,0.4), inset 0 0 4px rgba(0,229,255,0.2); }
.agent.candidate { background: var(--amber); border-color: #ffb84d; box-shadow: 0 0 10px rgba(245,165,36,0.6); transform: scale(1.1); z-index: 5; }
.agent.consensus { background: var(--blue); border-color: #60a5fa; box-shadow: 0 0 10px rgba(59,130,246,0.7); }
.agent.divergent { background: #2a1a0a; border-color: var(--amber); }
.agent.divergent::after {
  content: ''; position: absolute; inset: 2px;
  border: 1px solid var(--amber); border-radius: 1px; opacity: 0.5;
}

.inspector {
  margin: 12px;
  margin-top: 0;
  background: #070b12;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.inspector-header {
  padding: 8px 10px;
  background: var(--panel-2);
  border-bottom: 1px solid var(--border);
  font-family: 'IBM Plex Mono';
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-faint);
  display: flex; justify-content: space-between;
}
.inspector-body {
  padding: 10px;
  overflow-y: auto;
  flex: 1;
  font-family: 'IBM Plex Mono';
  font-size: 11px;
  line-height: 1.5;
}
.agent-stat { display: flex; justify-content: space-between; margin-bottom: 6px; }
.agent-stat span:first-child { color: var(--text-faint); }
.agent-stat span:last-child { color: var(--text); }
.agent-memories { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.mem-item {
  padding: 5px 6px;
  margin-bottom: 3px;
  background: rgba(255,255,255,0.02);
  border-radius: 3px;
  color: var(--text-dim);
  font-size: 10px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Mobile */
@media (max-width: 1100px) {
  .layout { grid-template-columns: 1fr 320px; }
  .panel:first-child { display: none; }
}
@media (max-width: 768px) {
  .layout { grid-template-columns: 1fr; }
  .panel:last-child { display: none; }
  .topbar { padding: 0 12px; }
  .status { display: none; }
}
</style>

<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="logo"><div class="logo-dot"></div>SWARM OS v1.0</div>
    </div>
    <div class="status">
      <div class="status-item"><div class="status-dot"></div><span id="agent-count">100 agents online</span></div>
      <div class="status-item"><div class="status-dot amber"></div><span>HOLD basin active</span></div>
      <div class="status-item"><span id="memory-count">0 memories</span></div>
    </div>
  </div>
  
  <div class="layout">
    <!-- LEFT: Memory Graph -->
    <div class="panel">
      <div class="panel-header">Memory Graph</div>
      <div class="panel-content">
        <canvas id="memory-canvas"></canvas>
        <div class="concepts" id="concepts"></div>
      </div>
    </div>
    
    <!-- CENTER: Workbench -->
    <div class="panel">
      <div class="workbench">
        <div class="modes">
          <button class="mode active" data-mode="recall">
            RECALL
            <span class="mode-desc">Direct retrieval</span>
          </button>
          <button class="mode" data-mode="forge">
            FORGE
            <span class="mode-desc">Build tools</span>
          </button>
          <button class="mode" data-mode="dream">
            DREAM
            <span class="mode-desc">Synthesize</span>
          </button>
        </div>
        <div class="output" id="output"></div>
        <div class="input-bar">
          <input id="input" class="input-main" placeholder="Ask a question or teach a fact..." autocomplete="off">
          <button class="btn" id="send">SEND</button>
        </div>
      </div>
    </div>
    
    <!-- RIGHT: Lattice -->
    <div class="panel">
      <div class="panel-header">Swarm Lattice • 10×10</div>
      <div class="panel-content" style="display:flex;flex-direction:column;">
        <div class="lattice-wrap">
          <div class="lattice" id="lattice"></div>
        </div>
        <div class="inspector">
          <div class="inspector-header">
            <span>Agent Inspector</span>
            <span id="inspector-id">—</span>
          </div>
          <div class="inspector-body" id="inspector">
            <div style="color:var(--text-faint); text-align:center; padding:20px 0;">Click an agent to inspect</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ===== SWARM OS CORE =====
const DIM = 64;

class VectorEncoder {
  encode(text) {
    const vec = new Float32Array(DIM);
    const words = text.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(Boolean);
    words.forEach(w => {
      let h = 2166136261;
      for (let i = 0; i < w.length; i++) {
        h ^= w.charCodeAt(i);
        h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
      }
      vec[Math.abs(h) % DIM] += 1;
    });
    const norm = Math.hypot(...vec) || 1;
    return Array.from(vec, v => v / norm);
  }
  cosine(a, b) {
    let s = 0;
    for (let i = 0; i < DIM; i++) s += a[i] * b[i];
    return s;
  }
}

class RecursiveMemoryAgent {
  constructor(id, encoder) {
    this.id = id;
    this.encoder = encoder;
    this.memories = [];
    this.divergent = Math.random() < 0.15; // HOLD basin
    this.lastActive = 0;
  }
  store(mem) {
    if (this.divergent && Math.random() < 0.3) {
      // HOLD agents store noisy variants
      mem = { ...mem, vector: mem.vector.map(v => v + (Math.random() - 0.5) * 0.1) };
    }
    this.memories.push(mem);
    this.lastActive = Date.now();
    if (this.memories.length > 200) this.memories.shift();
  }
  retrieve(queryVec, k = 3) {
    this.lastActive = Date.now();
    return this.memories
      .map(m => ({ mem: m, sim: this.encoder.cosine(queryVec, m.vector) }))
      .sort((a, b) => b.sim - a.sim)
      .slice(0, k)
      .filter(x => x.sim > 0.2);
  }
}

class SwarmOS {
  constructor() {
    this.encoder = new VectorEncoder();
    this.agents = Array.from({ length: 100 }, (_, i) => new RecursiveMemoryAgent(i, this.encoder));
    this.memories = [];
    this.concepts = new Map();
    this.nextId = 1;
    this.load();
  }
  
  parseFact(text) {
    const patterns = [
      { re: /(.+?) taught (.+?)$/i, pred: 'taught' },
      { re: /(.+?) created (.+?)$/i, pred: 'created' },
      { re: /(.+?) invented (.+?)$/i, pred: 'invented' },
      { re: /(.+?) founded (.+?)$/i, pred: 'founded' },
      { re: /(.+?) is (.+?)$/i, pred: 'is' },
      { re: /(.+?) discovered (.+?)$/i, pred: 'discovered' },
    ];
    for (const p of patterns) {
      const m = text.match(p.re);
      if (m) return { subject: m[1].trim(), predicate: p.pred, object: m[2].trim() };
    }
    return null;
  }
  
  teach(text) {
    const parsed = this.parseFact(text);
    const vector = this.encoder.encode(text);
    const mem = {
      id: this.nextId++,
      text,
      vector,
      timestamp: Date.now(),
      subject: parsed?.subject,
      predicate: parsed?.predicate,
      object: parsed?.object,
      tags: this.extractTags(text)
    };
    
    // Distribute to 28-38 agents (distributed memory)
    const count = 28 + Math.floor(Math.random() * 11);
    const selected = this.shuffle([...this.agents]).slice(0, count);
    selected.forEach(a => a.store(mem));
    mem.agentIds = selected.map(a => a.id);
    
    this.memories.push(mem);
    this.updateConcepts(mem);
    this.save();
    return { mem, agents: count };
  }
  
  extractTags(text) {
    return text.toLowerCase().match(/[a-z]{4,}/g)?.slice(0, 5) || [];
  }
  
  updateConcepts(mem) {
    const topics = [mem.subject, mem.object, ...mem.tags].filter(Boolean);
    topics.forEach(t => {
      if (!t) return;
      const key = t.toLowerCase();
      if (!this.concepts.has(key)) this.concepts.set(key, { name: t, count: 0, connections: new Set() });
      this.concepts.get(key).count++;
    });
    if (mem.subject && mem.object) {
      const s = mem.subject.toLowerCase(), o = mem.object.toLowerCase();
      this.concepts.get(s)?.connections.add(o);
      this.concepts.get(o)?.connections.add(s);
    }
  }
  
  recall(query) {
    const qVec = this.encoder.encode(query);
    const qLower = query.toLowerCase();
    
    // Try structured recall first
    let answer = null, sourceMem = null, distance = 0;
    
    // who taught X?
    let m = qLower.match(/who (?:taught|teached) (.+)/);
    if (m) {
      const obj = m[1].replace(/[?]/g, '').trim();
      const found = this.memories.find(mem => 
        mem.predicate === 'taught' && mem.object?.toLowerCase().includes(obj)
      );
      if (found) { answer = found.subject; sourceMem = found; distance = 0.94; }
    }
    
    // who did X teach?
    m = qLower.match(/who did (.+?) teach/);
    if (!answer && m) {
      const subj = m[1].trim();
      const found = this.memories.find(mem =>
        mem.predicate === 'taught' && mem.subject?.toLowerCase().includes(subj)
      );
      if (found) { answer = found.object; sourceMem = found; distance = 0.93; }
    }
    
    // what is / who is X?
    m = qLower.match(/(?:what|who) is (.+)/);
    if (!answer && m) {
      const subj = m[1].replace(/[?]/g, '').trim();
      const found = this.memories.find(mem =>
        mem.predicate === 'is' && mem.subject?.toLowerCase().includes(subj)
      );
      if (found) { answer = found.object; sourceMem = found; distance = 0.92; }
    }
    
    // Vector similarity fallback
    if (!answer) {
      const results = [];
      this.agents.forEach(agent => {
        agent.retrieve(qVec, 2).forEach(r => {
          results.push({ ...r, agentId: agent.id });
        });
      });
      results.sort((a, b) => b.sim - a.sim);
      const top = results.slice(0, 5);
      if (top.length && top[0].sim > 0.35) {
        sourceMem = top[0].mem;
        distance = top[0].sim;
        answer = sourceMem.text;
        // extract direct answer if possible
        if (sourceMem.subject && sourceMem.predicate && sourceMem.object) {
          if (qLower.includes('who') || qLower.includes('what')) {
            answer = sourceMem.object;
          }
        }
      }
    }
    
    const confirmingAgents = sourceMem ? sourceMem.agentIds || [] : [];
    return { answer, sourceMem, distance, agents: confirmingAgents, allResults: this.memories.length };
  }
  
  dream(prompt) {
    // Get memories from HOLD basin (divergent agents)
    const holdAgents = this.agents.filter(a => a.divergent && a.memories.length > 0);
    if (holdAgents.length < 2) return null;
    
    const m1 = this.sample(holdAgents).memories[0];

  }

      todo: `<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#070b12;color:#e2e8f0;font-family:system-ui;padding:24px} .app{max-width:520px;margin:0 auto} h1{font-size:20px;margin:0 0 16px;color:#00e5ff} .in{display:flex;gap:8px;margin-bottom:16px} input{flex:1;background:#0f1520;border:1px solid #1e293b;color:#e2e8f0;padding:10px 12px;border-radius:8px;font:14px system-ui} button{background:#00e5ff;color:#001e26;border:0;padding:10px 14px;border-radius:8px;font-weight:500;cursor:pointer} .item{display:flex;align-items:center;gap:10px;padding:10px;background:#0f1520;border:1px solid #1e293b;border-radius:8px;margin-bottom:8px} .item.done{opacity:.6} .item.done span{text-decoration:line-through} .item input{width:16px;height:16px}</style></head><body><div class="app"><h1>Swarm TODO</h1><div class="in"><input id="i" placeholder="Add task..."><button onclick="add()">Add</button></div><div id="l"></div></div><script>const l=document.getElementById('l'),i=document.getElementById('i');let t=JSON.parse(localStorage.getItem('swarm-todo')||'[]');function r(){l.innerHTML='';t.forEach((x,k)=>{l.innerHTML+=\`<div class="item \${x.d?'done':''}"><input type="checkbox" \${x.d?'checked':''} onchange="tog(\${k})"><span>\${x.t}</span></div>\`});localStorage.setItem('swarm-todo',JSON.stringify(t))}function add(){if(!i.value)return;t.unshift({t:i.value,d:0});i.value='';r()}function tog(k){t[k].d=!t[k].d;r()}i.onkeydown=e=>e.key==='Enter'&&add();r()<\/script></body></html>`,
      timer: `<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#030509;color:#e2e8f0;font-family:system-ui;display:grid;place-items:center;height:100vh} .t{text-align:center} .time{font:600 72px/1 'IBM Plex Mono',monospace;color:#00e5ff;text-shadow:0 0 20px rgba(0,229,255,.3);margin-bottom:24px} button{background:#0f1520;border:1px solid #1e293b;color:#e2e8f0;padding:12px 24px;border-radius:10px;margin:0 6px;font:500 14px system-ui;cursor:pointer} button.primary{background:#00e5ff;color:#001e26;border-color:#00e5ff}</style></head><body><div class="t"><div class="time" id="tm">25:00</div><div><button class="primary" onclick="start()">Start</button><button onclick="reset()">Reset</button></div></div><script>let s=1500,r=s,iv;const tm=document.getElementById('tm');function u(){let m=Math.floor(r/60),sec=r%60;tm.textContent=String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}function start(){if(iv)return;iv=setInterval(()=>{r--;u();if(r<=0){clearInterval(iv);iv=null;new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==').play()}},1000)}function reset(){clearInterval(iv);iv=null;r=s;u()}u()<\/script></body></html>`,
      markdown: `<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#070b12;color:#e2e8f0;font-family:system-ui;height:100vh;display:grid;grid-template-columns:1fr 1fr} textarea, .out{padding:20px;background:transparent;border:0;color:#e2e8f0;font:13px/1.6 'IBM Plex Mono',monospace;outline:none;resize:none} textarea{border-right:1px solid #1e293b} .out{overflow:auto;font-family:system-ui} h1,h2{color:#00e5ff}</style></head><body><textarea id="i" placeholder="# Hello Swarm\n\nType markdown..."># Swarm Notes

**Bold** and *italic*

- Swarm intelligence
- 100 agents
- HOLD basin</textarea><div class="out" id="o"></div><script>const i=document.getElementById('i'),o=document.getElementById('o');function r(){let t=i.value; t=t.replace(/^# (.*)/gm,'<h1>$1</h1>').replace(/^## (.*)/gm,'<h2>$1</h2>').replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/\*(.*?)\*/g,'<i>$1</i>').replace(/^- (.*)/gm,'<li>$1</li>'); o.innerHTML=t} i.oninput=r; r()<\/script></body></html>`
    };
    const key = toolName.toLowerCase();
    return tools[key] || tools.calculator;
  }
  
  shuffle(a) { return a.sort(() => Math.random() - 0.5); }
  sample(a) { return a[Math.floor(Math.random() * a.length)]; }
  capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  
  save() {
    localStorage.setItem('swarm_memories', JSON.stringify(this.memories.map(m => ({
      text: m.text, subject: m.subject, predicate: m.predicate, object: m.object, tags: m.tags
    }))));
  }
  load() {
    try {
      const data = JSON.parse(localStorage.getItem('swarm_memories') || '[]');
      data.forEach(d => this.teach(d.text));
    } catch {}
    if (this.memories.length === 0) {
      // Seed
      [
        "Socrates taught Plato",
        "Plato taught Aristotle",
        "Aristotle founded logic",
        "Alan Turing created the Turing machine",
        "Tim Berners-Lee invented the World Wide Web",
        "Python is a programming language",
        "Photosynthesis converts light to chemical energy",
        "Marie Curie discovered radium",
        "DNA stores genetic information",
        "The speed of light is 299,792,458 meters per second"
      ].forEach(t => this.teach(t));

// ===== UI =====
const swarm = new SwarmOS();
const output = document.getElementById('output');
const input = document.getElementById('input');
const lattice = document.getElementById('lattice');
const conceptsEl = document.getElementById('concepts');
const canvas = document.getElementById('memory-canvas');
const ctx = canvas.getContext('2d');

// Build lattice
for (let i = 0; i < 100; i++) {
  const d = document.createElement('div');
  d.className = 'agent idle' + (swarm.agents[i].divergent ? ' divergent' : '');
  d.dataset.id = i;
  d.onclick = () => inspectAgent(i);
  lattice.appendChild(d);
}

function setAgent(id, state, duration = 600) {
  const el = lattice.children[id];
  el.className = 'agent ' + state + (swarm.agents[id].divergent ? ' divergent' : '');
  if (duration) setTimeout(() => {
    el.className = 'agent idle' + (swarm.agents[id].divergent ? ' divergent' : '');
  }, duration);
}

async function swarmAnimation(agentIds) {
  // Phase 1: search
  const searchers = swarm.shuffle([...Array(100).keys()]).slice(0, 55);
  searchers.forEach(id => setAgent(id, 'search', 400));
  await sleep(250);
  // Phase 2: candidates
  agentIds.slice(0, 20).forEach(id => setAgent(id, 'candidate', 700));
  await sleep(350);
  // Phase 3: consensus wave
  for (let i = 0; i < 5; i++) {
    agentIds.forEach((id, idx) => {
      setTimeout(() => setAgent(id, 'consensus', 500), idx * 15);
    });
    await sleep(200);
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function addMessage(type, html) {
  const div = document.createElement('div');
  div.className = 'msg msg-' + type;
  div.innerHTML = html;
  output.appendChild(div);
  output.scrollTop = output.scrollHeight;
}

function inspectAgent(id) {
  const agent = swarm.agents[id];
  document.getElementById('inspector-id').textContent = `#${id.toString().padStart(3,'0')}`;
  const inspector = document.getElementById('inspector');
  inspector.innerHTML = `
    <div class="agent-stat"><span>Type</span><span style="color:${agent.divergent?'#f5a524':'#00e5ff'}">${agent.divergent ? 'HOLD (divergent)' : 'Standard'}</span></div>
    <div class="agent-stat"><span>Memories</span><span>${agent.memories.length}</span></div>
    <div class="agent-stat"><span>Last active</span><span>${agent.lastActive ? Math.floor((Date.now()-agent.lastActive)/1000)+'s ago' : 'idle'}</span></div>
    <div class="agent-memories">
      ${agent.memories.slice(-5).reverse().map(m => `<div class="mem-item" title="${m.text}">${m.text}</div>`).join('') || '<div style="color:var(--text-faint)">No memories</div>'}
    </div>
  `;
  // highlight
  [...lattice.children].forEach(c => c.style.outline = '');
  lattice.children[id].style.outline = '2px solid var(--cyan)';
  setTimeout(() => lattice.children[id].style.outline = '', 2000);
}

// Render memory graph
function resizeCanvas() {
  canvas.width = canvas.offsetWidth * devicePixelRatio;
  canvas.height = canvas.offsetHeight * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
  renderGraph();
}
function renderGraph(highlight = null) {
  const w = canvas.offsetWidth, h = canvas.offsetHeight;
  ctx.clearRect(0, 0, w, h);
  
  // background grid
  ctx.strokeStyle = '#0f1520';
  ctx.lineWidth = 1;
  for (let x = 0; x < w; x += 24) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  for (let y = 0; y < h; y += 24) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  
  const concepts = Array.from(swarm.concepts.entries()).slice(0, 12);
  if (!concepts.length) return;
  
  const cx = w/2, cy = h/2, r = Math.min(w,h)*0.32;
  const nodes = concepts.map(([key, c], i) => {
    const angle = (i / concepts.length) * Math.PI * 2 - Math.PI/2;
    return {
      x: cx + Math.cos(angle) * r,
      y: cy + Math.sin(angle) * r,
      ...c, key,
      size: 4 + Math.min(c.count, 20) * 0.8
    };
  });
  
  // edges
  ctx.strokeStyle = 'rgba(0,229,255,0.08)';
  ctx.lineWidth = 1;
  nodes.forEach(n => {
    n.connections.forEach(conn => {
      const target = nodes.find(x => x.key === conn);
      if (target) {
        ctx.beginPath();
        ctx.moveTo(n.x, n.y);
        ctx.lineTo(target.x, target.y);
        ctx.stroke();
      }
    });
  });
  
  // nodes
  nodes.forEach(n => {
    const isHi = highlight && n.key === highlight;
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.size + (isHi ? 3 : 0), 0, Math.PI*2);
    ctx.fillStyle = isHi ? '#00e5ff' : 'rgba(0,229,255,0.85)';
    ctx.shadowColor = isHi ? '#00e5ff' : 'transparent';
    ctx.shadowBlur = isHi ? 12 : 0;
    ctx.fill();
    ctx.shadowBlur = 0;
    
    ctx.fillStyle = '#e2e8f0';
    ctx.font = '11px Inter';
    ctx.textAlign = 'center';
    ctx.fillText(n.name, n.x, n.y + n.size + 14);
  });
}

function updateConcepts() {
  conceptsEl.innerHTML = '';
  const sorted = Array.from(swarm.concepts.values()).sort((a,b) => b.count - a.count).slice(0, 14);
  sorted.forEach(c => {
    const div = document.createElement('div');
    div.className = 'concept';
    div.innerHTML = `<span class="concept-name">${c.name}</span><span class="concept-count">${c.count}</span>`;
    div.onclick = () => {
      document.querySelectorAll('.concept').forEach(x => x.classList.remove('active'));
      div.classList.add('active');
      renderGraph(c.name.toLowerCase());
      // Show related memories
      const related = swarm.memories.filter(m => 
        m.text.toLowerCase().includes(c.name.toLowerCase())
      ).slice(0,3);
      if (related.length) {
        addMessage('system', `Concept "${c.name}" • ${c.count} references<br>${related.map(r => `→ ${r.text}`).join('<br>')}`);
      }
    };
    conceptsEl.appendChild(div);
  });
  document.getElementById('memory-count').textContent = `${swarm.memories.length} memories`;
}

let currentMode = 'recall';
document.querySelectorAll('.mode').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.mode').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = btn.dataset.mode;
    input.placeholder = currentMode === 'recall' ? 'Ask a question or teach a fact...' :
                       currentMode === 'forge' ? 'Type /build [tool] — e.g. /build calculator' :
                       'Describe what to dream...';
    input.focus();
  };
});

async function handleInput() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  
  addMessage('user', text);
  
  if (currentMode === 'recall') {
    const isQuestion = /[?]|^(who|what|when|where|why|how|who's|what's)/i.test(text);
    
    if (!isQuestion) {
      // Teach
      const result = swarm.teach(text);
      await swarmAnimation(result.mem.agentIds);
      addMessage('system', `Encoded. Stored in <b>${result.agents} agents</b>. ${result.mem.subject ? `Linked: ${result.mem.subject} → ${result.mem.object}` : 'Tags: ' + result.mem.tags.join(', ')}`);
      updateConcepts();
      renderGraph();
    } else {
      // Recall
      const start = performance.now();
      const result = swarm.recall(text);
      await swarmAnimation(result.agents);
      const elapsed = Math.round(performance.now() - start);
      
      if (result.answer) {
        addMessage('answer', `
          <div class="answer-main">${result.answer}</div>
          <div class="answer-meta">
            <span>source <b>"${result.sourceMem?.text}"</b></span>
            <span>distance <b>${result.distance.toFixed(2)}</b></span>
            <span>agents <b>${result.agents.length}/100</b></span>
            <span>${elapsed}ms</span>
          </div>
        `);
        if (result.sourceMem?.subject) {
          renderGraph(result.sourceMem.subject.toLowerCase());
        }
      } else {
        addMessage('system', `I don't know this. <span style="color:var(--text)">Teach me:</span> "${text.replace(/[?]/g,'').replace(/^(who|what) /i,'')} is ..."`);
      }
    }
  }
  
  else if (currentMode === 'forge') {
    const match = text.match(/\/build\s+(.+)/i) || text.match(/build\s+(.+)/i);
    const tool = match ? match[1] : text;
    
    addMessage('system', `FORGE: building "${tool}"...`);
    
    // Simulate swarm building
    const builders = swarm.shuffle([...Array(100).keys()]).slice(0, 100);
    for (let i = 0; i < 3; i++) {
      builders.slice(i*30, (i+1)*30).forEach(id => setAgent(id, i===2 ? 'consensus' : 'search', 500));
      await sleep(300);
    }
    
    const code = swarm.build(tool);
    const log = [
      `[1/3] 100 agents analyzing "${tool}"`,
      `[2/3] 12 agents proposed implementations, 88 converged`,
      `[3/3] Synthesizing • ${Math.floor(code.length/1024)}kb output`
    ].join('<br>');
    
    addMessage('build', `
      <div class="build-header">
        <div class="build-title">${tool.toUpperCase()}</div>
        <div class="build-meta">generated • ${new Date().toLocaleTimeString()}</div>
      </div>
      <div class="build-preview"><iframe srcdoc="${code.replace(/"/g, '&quot;')}"></iframe></div>
      <div class="build-log">${log}</div>
    `);
    
    swarm.teach(`Tool: ${tool} created`);
    updateConcepts();
  }
  
  else if (currentMode === 'dream') {
    addMessage('system', `DREAM: sampling HOLD basin...`);
    const holders = swarm.agents.filter(a => a.divergent).map(a => a.id);
    holders.forEach(id => setAgent(id, 'candidate', 800));
    await sleep(600);
    
    const dream = swarm.dream(text);
    if (dream) {
      addMessage('dream', `
        <div class="dream-title">◈ ${dream.title}</div>
        <div class="dream-content">${dream.content}</div>
        <div class="dream-sources">Synthesized from: ${dream.sources.map(s => `"${s.text}"`).join(' + ')}</div>
      `);
    }
  }
}

document.getElementById('send').onclick = handleInput;
input.onkeydown = e => { if (e.key === 'Enter') handleInput(); };

// Init
window.onresize = resizeCanvas;
resizeCanvas();
updateConcepts();
renderGraph();

// Initial message
addMessage('system', `<b>SWARM OS INITIALIZED</b><br>100 agents online • HOLD basin active<br><br>I hold <b>${swarm.memories.length} memories</b> across ${swarm.concepts.size} concepts.<br><br><b>RECALL:</b> Ask "who taught Plato?" or teach "X is Y"<br><b>FORGE:</b> Type "/build calculator"<br><b>DREAM:</b> Synthesize novel concepts`);

// Idle animation
setInterval(() => {
  const id = Math.floor(Math.random() * 100);
  if (!lattice.children[id].className.includes('search')) {
    setAgent(id, 'search', 800);
  }
}, 1200);

// Demo hint
setTimeout(() => {
  if (output.children.length === 1) {
    input.value = 'who taught Plato?';
    input.style.boxShadow = '0 0 0 3px rgba(0,229,255,0.2)';
    setTimeout(() => input.style.boxShadow = '', 2000);
  }
}, 3000);
