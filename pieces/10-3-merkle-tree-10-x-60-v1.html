<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitcoin Mining Collapse Visualization</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan: #00ffff;
    --magenta: #ff00aa;
    --gold: #ffc400;
    --bg: #03040a;
  }
  * { cursor: default; }
  body {
    background: var(--bg);
    font-family: 'JetBrains Mono', monospace;
    overscroll-behavior: none;
  }
  .orbitron { font-family: 'Orbitron', sans-serif; }
  .neon-cyan { text-shadow: 0 0 4px rgba(0,255,255,.8), 0 0 12px rgba(0,255,255,.6), 0 0 28px rgba(0,255,255,.4); }
  .neon-gold { text-shadow: 0 0 4px rgba(255,196,0,.9), 0 0 14px rgba(255,164,0,.7), 0 0 32px rgba(255,140,0,.5); }
  .neon-mag { text-shadow: 0 0 4px rgba(255,0,170,.8), 0 0 12px rgba(255,0,170,.5); }
  .grid-bg {
    background-image: 
      linear-gradient(rgba(0,255,255,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,255,.07) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .scanlines::after {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(transparent 0 2px, rgba(0,255,255,.03) 2px 3px);
    pointer-events: none;
  }
  .glass {
    backdrop-filter: blur(12px);
    background: linear-gradient(180deg, rgba(10,15,30,.7), rgba(5,8,18,.6));
    border: 1px solid rgba(0,255,255,.15);
  }
</style>
</head>
<body class="text-cyan-100 overflow-hidden select-none">
<div class="relative w-screen h-screen bg-[#020309] grid-bg scanlines">
  <!-- vignette -->
  <div class="absolute inset-0 pointer-events-none" style="background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.9) 100%)"></div>
  
  <canvas id="c" class="absolute inset-0 w-full h-full"></canvas>

  <!-- HUD -->
  <div class="absolute top-0 left-0 right-0 p-4 md:p-8 flex justify-between items-start pointer-events-none">
    <div class="glass rounded-xl px-4 py-2.5">
      <div class="text-[10px] tracking-[0.3em] text-cyan-400/70">BITCOIN MINING</div>
      <div class="orbitron font-bold text-lg md:text-xl neon-cyan">COLLAPSE SEQUENCE</div>
    </div>
    <div class="glass rounded-xl px-4 py-2.5 text-right">
      <div class="text-[10px] tracking-[0.3em] text-cyan-400/70">CYCLE</div>
      <div class="orbitron text-lg md:text-xl"><span id="timer">20.0</span>s</div>
    </div>
  </div>

  <!-- Center Labels -->
  <div class="absolute left-1/2 top-[12%] md:top-[14%] -translate-x-1/2 w-[92%] max-w-5xl text-center pointer-events-none">
    <div id="big" class="orbitron font-black text-[clamp(28px,6vw,72px)] leading-none neon-cyan transition-all duration-500">10 × 60 × 20 × 3 = 36,000</div>
    <div id="sub" class="mt-3 inline-block glass rounded-full px-5 py-1.5 text-[11px] md:text-sm tracking-widest text-cyan-200/90 uppercase">INITIAL SEARCH SPACE</div>
  </div>

  <!-- Right info -->
  <div class="absolute right-3 md:right-8 top-[46%] -translate-y-1/2 space-y-2 pointer-events-none hidden sm:block">
    <div class="glass rounded-lg px-3 py-2 text-right">
      <div class="text-[10px] text-cyan-400/60">LEAVES</div>
      <div id="leaves" class="orbitron text-xl neon-cyan">36,000</div>
    </div>
    <div class="glass rounded-lg px-3 py-2 text-right">
      <div class="text-[10px] text-cyan-400/60">GRID</div>
      <div class="orbitron text-xl">64×64</div>
    </div>
    <div class="glass rounded-lg px-3 py-2 text-right">
      <div class="text-[10px] text-amber-400/70">FORTRESS</div>
      <div class="orbitron text-xl neon-gold">1,225</div>
    </div>
  </div>

  <!-- Bottom formula -->
  <div class="absolute bottom-0 left-0 right-0">
    <div class="mx-auto mb-4 w-[96%] max-w-6xl glass rounded-2xl px-3 md:px-6 py-3 md:py-4">
      <div class="flex items-center justify-between gap-2 md:gap-4 text-[10px] md:text-xs text-cyan-300/60 uppercase tracking-widest mb-2">
        <span>Collapse Path</span>
        <span class="hidden md:block">20s loop • dark cyberpunk</span>
      </div>
      <div class="flex items-center justify-between orbitron font-bold text-[14px] sm:text-lg md:text-2xl flex-wrap gap-y-1">
        <span data-step="36000" class="step px-2 py-1 rounded transition">36,000</span>
        <span class="text-cyan-400/40">→</span>
        <span data-step="3002" class="step px-2 py-1 rounded transition">3,002</span>
        <span class="text-cyan-400/40">→</span>
        <span data-step="4096" class="step px-2 py-1 rounded transition">4,096</span>
        <span class="text-cyan-400/40">→</span>
        <span data-step="1225" class="step px-2 py-1 rounded transition neon-gold">1,225</span>
        <span class="text-cyan-400/40">→</span>
        <span data-step="256" class="step px-2 py-1 rounded transition">256</span>
        <span class="text-cyan-400/40">→</span>
        <span data-step="1" class="step px-2 py-1 rounded transition neon-mag">1</span>
      </div>
    </div>
  </div>

  <!-- Core flash -->
  <div id="flash" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none opacity-0 transition-opacity duration-300">
    <div class="orbitron font-black text-4xl md:text-7xl neon-mag text-center">MERKLE ROOT<br>LOCKED</div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: true });
let W, H, DPR;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.width = innerWidth * DPR;
  H = canvas.height = innerHeight * DPR;
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
}
window.addEventListener('resize', resize);
resize();

// data
const CORE_COUNT = 3002;
const DUST_COUNT = 36000 - CORE_COUNT;
const GRID = 64;
const TOTAL_CELLS = GRID * GRID;

// pick 3002 random cells
const cells = [...Array(TOTAL_CELLS).keys()];
for (let i = cells.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [cells[i], cells[j]] = [cells[j], cells[i]];
}
const chosen = cells.slice(0, CORE_COUNT);

const cores = [];
const fortresses = [
  {x:-0.27, y:-0.27}, {x:0.27, y:-0.27},
  {x:-0.27, y:0.27}, {x:0.27, y:0.27}
];

for (let i=0;i<CORE_COUNT;i++) {
  const angle = Math.random()*Math.PI*2;
  const rad = Math.pow(Math.random(),0.7)*0.9;
  const cloudX = Math.cos(angle)*rad;
  const cloudY = Math.sin(angle)*rad*0.85;
  
  const idx = chosen[i];
  const col = idx % GRID;
  const row = Math.floor(idx / GRID);
  const gridX = (col/(GRID-1)-0.5)*1.18;
  const gridY = (row/(GRID-1)-0.5)*1.18;
  
  const sq = i % 4;
  const f = fortresses[sq];
  const fx = f.x + (Math.random()-0.5)*0.24;
  const fy = f.y + (Math.random()-0.5)*0.24;
  
  const spineIdx = i % 256;
  const sx = ((spineIdx % 4)-1.5)*0.038;
  const sy = (Math.floor(spineIdx/4)/63 - 0.5)*0.88;
  
  cores.push({cloudX,cloudY,gridX,gridY,fx,fy,sx,sy, phase: Math.random()});
}

const dust = new Array(DUST_COUNT).fill(0).map(()=>{
  const a = Math.random()*Math.PI*2;
  const r = Math.pow(Math.random(),0.6)*0.95;
  return {x:Math.cos(a)*r, y:Math.sin(a)*r*0.9};
});

const lerp = (a,b,t)=>a+(b-a)*t;
const ease = t => t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;

const big = document.getElementById('big');
const sub = document.getElementById('sub');
const leavesEl = document.getElementById('leaves');
const timerEl = document.getElementById('timer');
const flash = document.getElementById('flash');
const steps = document.querySelectorAll('.step');

function setStep(active) {
  steps.forEach(s=>{
    const on = s.dataset.step===active;
    s.style.background = on ? 'rgba(0,255,255,.12)' : 'transparent';
    s.style.boxShadow = on ? '0 0 12px rgba(0,255,255,.3) inset' : 'none';
    s.style.color = on ? '#7df9ff' : '';
  });
}

const CYCLE = 20000;
let lastPhase = -1;

function updateLabels(t) {
  const timeLeft = ((CYCLE - (performance.now()%CYCLE))/1000).toFixed(1);
  timerEl.textContent = timeLeft;
  
  let phase=0;
  if (t<0.15){ phase=0; big.innerHTML='10 × 60 × 20 × 3 = <span class="neon-cyan">36,000</span>'; sub.textContent='INITIAL SEARCH SPACE'; leavesEl.textContent='36,000'; setStep('36000'); }
  else if (t<0.3){ phase=1; big.innerHTML='36,000 <span class="text-cyan-400/60">→</span> <span class="neon-cyan">3,002</span>'; sub.textContent='COLLAPSE 1 — LEAVES'; leavesEl.textContent='3,002'; setStep('3002'); }
  else if (t<0.45){ phase=2; big.innerHTML='<span class="neon-cyan">3,002</span> <span class="text-[0.6em] opacity-70">/</span> 4,096'; sub.textContent='SETTLING INTO 64×64 GRID'; leavesEl.textContent='3,002'; setStep('4096'); }
  else if (t<0.6){ phase=3; big.innerHTML='<span class="neon-gold">17.5 × 17.5 × 4 = 1,225</span>'; sub.textContent='FORTRESS BAND: -00800 to +00950'; leavesEl.textContent='1,225'; setStep('1225'); }
  else if (t<0.75){ phase=4; big.innerHTML='3,002 <span class="text-amber-400/70">⇢</span> 1,225'; sub.textContent='8-PETAL STREAM THROUGH FORTRESS'; leavesEl.textContent='1,225'; setStep('1225'); }
  else if (t<0.9){ phase=5; big.innerHTML='64 × 4 = <span class="neon-cyan">256</span>'; sub.textContent='SPINE NODES'; leavesEl.textContent='256'; setStep('256'); }
  else { phase=6; big.innerHTML='<span class="neon-mag">9 9 9 → 0 0 0 1</span>'; sub.textContent='MERKLE ROOT LOCKED'; leavesEl.textContent='1'; setStep('1'); }
  
  if (phase!==lastPhase){ lastPhase=phase; big.style.transform='scale(0.96)'; setTimeout(()=>big.style.transform='scale(1)',120); }
  flash.style.opacity = t>0.92 ? '1' : '0';
}

function drawGrid(scale, cx, cy) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = 'rgba(0,255,255,0.08)';
  ctx.lineWidth = 1*DPR;
  const size = 1.2*scale;
  const step = size/GRID;
  ctx.beginPath();
  for(let i=0;i<=GRID;i++){
    const p = -size/2 + i*step;
    ctx.moveTo(p, -size/2); ctx.lineTo(p, size/2);
    ctx.moveTo(-size/2, p); ctx.lineTo(size/2, p);
  }
  ctx.stroke();
  // outer
  ctx.strokeStyle='rgba(0,255,255,0.25)';
  ctx.lineWidth=2*DPR;
  ctx.strokeRect(-size/2,-size/2,size,size);
  ctx.restore();
}

function drawFortress(scale,cx,cy,t){
  ctx.save();
  ctx.translate(cx,cy);
  const pulse = 0.5+0.5*Math.sin(performance.now()*0.004);
  fortresses.forEach((f,i)=>{
    const x = f.x*scale;
    const y = f.y*scale;
    const s = 0.285*scale;
    ctx.shadowColor = '#ffc400';
    ctx.shadowBlur = 20*pulse*DPR;
    ctx.strokeStyle = `rgba(255,196,0,${0.6+0.3*pulse})`;
    ctx.lineWidth = 3*DPR;
    ctx.strokeRect(x-s/2, y-s/2, s, s);
    
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,196,0,0.08)';
    ctx.fillRect(x-s/2, y-s/2, s, s);
    
    ctx.fillStyle='#ffc400';
    ctx.font = `${14*DPR}px 'JetBrains Mono'`;
    ctx.textAlign='center';
    ctx.fillText('17.5²', x, y- s/2 - 8*DPR);
  });
  // band label
  ctx.fillStyle='rgba(255,196,0,0.9)';
  ctx.font = `${12*DPR}px 'Orbitron'`;
  ctx.fillText('-00800  to  +00950', 0, -0.55*scale);
  ctx.restore();
}

function drawPetals(scale,cx,cy,t){
  if(t<0.58 || t>0.77) return;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.strokeStyle='rgba(0,255,255,0.18)';
  ctx.lineWidth=1.5*DPR;
  ctx.shadowColor='#00ffff'; ctx.shadowBlur=8*DPR;
  for(let p=0;p<8;p++){
    ctx.beginPath();
    for(let a=0;a<Math.PI*2;a+=0.02){
      const r = 0.62*scale * Math.abs(Math.sin(4*a + p*0.2)) * (0.6+0.4*Math.sin(t*20));
      const x = Math.cos(a+p)*r*0.5;
      const y = Math.sin(a+p)*r*0.5;
      if(a===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function drawSpine(scale,cx,cy){
  ctx.save();
  ctx.translate(cx,cy);
  ctx.fillStyle='rgba(0,255,255,0.9)';
  ctx.shadowColor='#00ffff'; ctx.shadowBlur=12*DPR;
  for(let i=0;i<256;i++){
    const x = ((i%4)-1.5)*0.038*scale;
    const y = (Math.floor(i/4)/63 -0.5)*0.88*scale;
    ctx.globalAlpha = 0.7 + 0.3*Math.sin(performance.now()*0.003 + i*0.1);
    ctx.beginPath();
    ctx.arc(x,y,2.2*DPR,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function draw(){
  const now = performance.now();
  const t = (now % CYCLE) / CYCLE;
  updateLabels(t);
  
  ctx.clearRect(0,0,W,H);
  // fade trail
  ctx.fillStyle='rgba(2,3,9,0.25)';
  ctx.fillRect(0,0,W,H);
  
  const cx = W/2, cy = H/2;
  const scale = Math.min(W,H)*0.42;
  
  // background glow
  const g = ctx.createRadialGradient(cx,cy,0,cx,cy,scale*1.4);
  g.addColorStop(0,'rgba(0,255,255,0.06)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(cx,cy,scale*1.4,0,7); ctx.fill();
  
  if(t>0.28) drawGrid(scale,cx,cy);
  if(t>0.43) drawFortress(scale,cx,cy,t);
  drawPetals(scale,cx,cy,t);
  if(t>0.73) drawSpine(scale,cx,cy);
  
  // dust
  if(t<0.32){
    const fade = 1 - (t/0.32);
    ctx.fillStyle=`rgba(0,255,200,${0.25*fade})`;
    for(const d of dust){
      const x = cx + d.x*scale*1.1;
      const y = cy + d.y*scale*1.1;
      ctx.fillRect(x,y,1.2*DPR,1.2*DPR);
    }
  }
  
  // cores
  ctx.shadowColor='#00ffff';
  for(let i=0;i<CORE_COUNT;i++){
    const p = cores[i];
    let x,y,size=2.1,alpha=0.95;
    if(t<0.15){
      x=p.cloudX; y=p.cloudY; size=1.4;
    } else if(t<0.3){
      const k=ease((t-0.15)/0.15);
      x=lerp(p.cloudX,p.cloudX*0.38,k);
      y=lerp(p.cloudY,p.cloudY*0.38,k);
      size=1.4+k*0.8;
    } else if(t<0.45){
      const k=ease((t-0.3)/0.15);
      x=lerp(p.cloudX*0.38,p.gridX,k);
      y=lerp(p.cloudY*0.38,p.gridY,k);
    } else if(t<0.6){
      x=p.gridX; y=p.gridY;
    } else if(t<0.75){
      const k=ease((t-0.6)/0.15);
      x=lerp(p.gridX,p.fx,k);
      y=lerp(p.gridY,p.fy,k);
      const swirl = Math.sin(k*Math.PI*3 + p.phase*6.28)*0.015*(1-k);
      x+=Math.cos(p.phase*10+now*0.001)*swirl;
      y+=Math.sin(p.phase*10+now*0.001)*swirl;
    } else if(t<0.9){
      const k=ease((t-0.75)/0.15);
      x=lerp(p.fx,p.sx,k);
      y=lerp(p.fy,p.sy,k);
    } else {
      const k=ease((t-0.9)/0.1);
      x=lerp(p.sx,0,k);
      y=lerp(p.sy,0,k);
      size=2.2 + k*6;
      alpha=1;
    }
    
    const px = cx + x*scale;
    const py = cy + y*scale;
    
    // color by phase
    let col = '0,255,255';
    if(t>0.45 && t<0.75) col='255,196,0';
    if(t>0.9) col='255,0,170';
    
    ctx.shadowBlur = (t>0.9?24:10)*DPR;
    ctx.globalAlpha = alpha;
    ctx.fillStyle=`rgba(${col},${alpha})`;
    ctx.beginPath();
    ctx.arc(px,py,size*DPR,0,Math.PI*2);
    ctx.fill();
    
    // core glow for grid
    if(t>0.3 && t<0.6){
      ctx.globalAlpha=0.15;
      ctx.beginPath(); ctx.arc(px,py,6*DPR,0,7); ctx.fill();
    }
  }
  ctx.globalAlpha=1; ctx.shadowBlur=0;
  
  // root core
  if(t>0.88){
    const k = (t-0.88)/0.12;
    const r = 20*DPR + k*80*DPR;
    ctx.save();
    ctx.translate(cx,cy);
    ctx.shadowColor='#ff00aa'; ctx.shadowBlur=40*DPR;
    const rg = ctx.createRadialGradient(0,0,0,0,0,r);
    rg.addColorStop(0,'rgba(255,0,170,0.9)');
    rg.addColorStop(0.3,'rgba(255,0,170,0.4)');
    rg.addColorStop(1,'rgba(255,0,170,0)');
    ctx.fillStyle=rg;
    ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.shadowBlur=20*DPR;
    ctx.beginPath(); ctx.arc(0,0,6*DPR,0,7); ctx.fill();
    ctx.restore();
  }
  
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
