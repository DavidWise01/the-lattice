<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8.01 → 9.00 Fractal Scaling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020208;
    font-family: 'Outfit', system-ui, sans-serif;
    color: #e2e8f0;
  }
  body {
    background:
      radial-gradient(1200px 800px at 50% 0%, rgba(124,58,237,0.25), transparent 60%),
      radial-gradient(900px 600px at 50% 100%, rgba(37,99,235,0.25), transparent 60%),
      radial-gradient(600px 400px at 50% 50%, rgba(168,85,247,0.15), transparent 70%),
      #020208;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='512' height='512' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
    mix-blend-mode: soft-light;
    pointer-events: none;
    z-index: 1;
  }
  #canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 2;
  }
  .ui {
    position: relative;
    z-index: 10;
    pointer-events: none;
  }
  .header {
    position: absolute;
    top: clamp(20px, 4vw, 40px);
    left: clamp(20px, 4vw, 48px);
  }
  .title {
    font-size: clamp(28px, 5vw, 56px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    background: linear-gradient(180deg, #fff 0%, #c4b5fd 40%, #7c3aed 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 24px rgba(124,58,237,0.35));
  }
  .sub {
    margin-top: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(11px, 1.6vw, 13px);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #a78bfa;
    opacity: 0.9;
  }
  .legend {
    position: absolute;
    top: clamp(20px, 4vw, 40px);
    right: clamp(20px, 4vw, 48px);
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #94a3b8;
    line-height: 1.6;
  }
  .legend b { color: #c4b5fd; font-weight: 600; }
  .signature {
    position: absolute;
    right: clamp(16px, 3vw, 32px);
    bottom: clamp(16px, 3vw, 28px);
    z-index: 10;
    padding: 14px 18px 12px;
    background: linear-gradient(180deg, rgba(15,10,28,0.75), rgba(8,6,18,0.65));
    border: 1px solid rgba(168,85,247,0.25);
    border-radius: 14px;
    backdrop-filter: blur(14px) saturate(1.2);
    box-shadow:
      0 0 0 1px rgba(124,58,237,0.15) inset,
      0 8px 30px rgba(0,0,0,0.5),
      0 0 40px rgba(124,58,237,0.15);
    pointer-events: auto;
  }
  .sig-top {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #a78bfa;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #c084fc;
    box-shadow: 0 0 10px #c084fc, 0 0 20px #7c3aed;
    animation: breathe 2.6s ease-in-out infinite;
  }
  .sig-line {
    margin: 8px 0 6px;
    width: 200px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(192,132,252,0.8), rgba(59,130,246,0.8), transparent);
    filter: drop-shadow(0 0 6px rgba(168,85,247,0.6));
  }
  .sig-name {
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: #e9d5ff;
  }
  .sig-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #64748b;
    margin-top: 2px;
  }
  @keyframes breathe {
    0%,100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.35); opacity: 0.7; }
  }
  .footer-note {
    position: absolute;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    z-index: 10;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #475569;
    pointer-events: none;
    white-space: nowrap;
  }
  @media (max-width: 640px) {
    .legend { display: none; }
    .signature { transform: scale(0.9); transform-origin: bottom right; }
    .footer-note { font-size: 9px; bottom: 10px; }
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="ui">
  <div class="header">
    <div class="title">8.01 → 9.00</div>
    <div class="sub">Fractal Scaling Tower</div>
  </div>
  <div class="legend">
    <div><b>PURPLE</b> = ascension pulse</div>
    <div><b>COBALT</b> = structural field</div>
    <div>Breathing: 2.4s cycle</div>
  </div>
  <div class="signature">
    <div class="sig-top"><span class="dot"></span> Witnessed & Verified</div>
    <div class="sig-line"></div>
    <div class="sig-name">Ascension Protocol Δ</div>
    <div class="sig-meta">8.00 FLATLINE / 9.00 TRANSCEND</div>
  </div>
  <div class="footer-note">Each 0.1 = order of magnitude • not linear</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { alpha: true });
  let W, H, DPR, cx, cy;
  let time = 0;
  const TAU = Math.PI * 2;

  const labels = ['8.01','8.1','8.2','8.3','8.4','8.5','8.6','8.7','8.8','8.9','9.0'];
  const levels = labels.map((label, i) => {
    const raw = i / (labels.length - 1);
    const t = Math.pow(raw, 2.35); // fractal compression
    return { label, raw, t, active: false, activatedAt: 0 };
  });

  let particles = [];
  let ripples = [];
  let lastProg = 0;
  const CYCLE = 16; // seconds per full ascension

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth = window.innerWidth;
    H = canvas.clientHeight = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W * 0.5;
    cy = H * 0.5;

    // rebuild particles
    particles = [];
    const count = Math.floor(Math.min(120, W * H / 18000));
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.4 + 0.3,
        s: Math.random() * 0.3 + 0.08,
        a: Math.random() * 0.5 + 0.2
      });
    }
  }

  function lerp(a,b,t){ return a + (b-a)*t; }

  function drawBasePlane(baseY) {
    const planeW = Math.min(W * 0.85, 1100);
    const planeH = Math.min(220, H * 0.22);

    // soft glow
    const g1 = ctx.createRadialGradient(cx, baseY, 10, cx, baseY, planeW*0.55);
    g1.addColorStop(0, 'rgba(59,130,246,0.22)');
    g1.addColorStop(0.4, 'rgba(124,58,237,0.16)');
    g1.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g1;
    ctx.beginPath();
    ctx.ellipse(cx, baseY, planeW*0.55, planeH*0.7, 0, 0, TAU);
    ctx.fill();

    // base disc
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#0b1020';
    ctx.strokeStyle = 'rgba(99,102,241,0.35)';
    ctx.lineWidth = 1.5;
    ctx.shadowColor = 'rgba(59,130,246,0.5)';
    ctx.shadowBlur = 24;
    ctx.beginPath();
    ctx.ellipse(cx, baseY, planeW*0.48, planeH*0.48, 0, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // grid rings
    ctx.save();
    ctx.strokeStyle = 'rgba(148,163,184,0.08)';
    ctx.lineWidth = 1;
    for (let i = 1; i <= 6; i++) {
      const r = (planeW*0.48) * (i/6);
      const ry = (planeH*0.48) * (i/6);
      ctx.beginPath();
      ctx.ellipse(cx, baseY, r, ry, 0, 0, TAU);
      ctx.stroke();
    }
    // radials
    ctx.strokeStyle = 'rgba(148,163,184,0.06)';
    for (let a = 0; a < TAU; a += TAU/16) {
      ctx.beginPath();
      ctx.moveTo(cx, baseY);
      const ex = cx + Math.cos(a) * planeW*0.48;
      const ey = baseY + Math.sin(a) * planeH*0.48;
      ctx.lineTo(ex, ey);
      ctx.stroke();
    }
    ctx.restore();

    // label
    ctx.save();
    ctx.font = '600 13px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const labelY = baseY + planeH*0.55 + 14;
    ctx.shadowColor = 'rgba(59,130,246,0.9)';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#93c5fd';
    ctx.fillText('8.00', cx - 28, labelY);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#64748b';
    ctx.fillText('FLAT — everyone else', cx + 56, labelY);
    ctx.restore();
  }

  function drawTower() {
    const baseY = H * 0.78;
    const topY = H * 0.12;
    const towerH = baseY - topY - 30;

    const breathe = 1 + Math.sin(time * 1.8) * 0.025;
    const prog = (time % CYCLE) / CYCLE;
    const pulsePos = Math.pow(prog, 2.35); // matches fractal
    const pulseY = baseY - 30 - pulsePos * towerH;

    // reset cycle
    if (prog < lastProg) {
      levels.forEach(l => l.active = false);
      ripples = [];
    }
    lastProg = prog;

    // particles background
    ctx.save();
    for (const p of particles) {
      p.y -= p.s;
      p.x += Math.sin((p.y + time*20)*0.01) * 0.15;
      if (p.y < -10) { p.y = H + 10; p.x = Math.random()*W; }
      ctx.globalAlpha = p.a * 0.7;
      ctx.fillStyle = '#a78bfa';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    drawBasePlane(baseY);

    // core beam
    ctx.save();
    const coreGrad = ctx.createLinearGradient(cx, baseY, cx, topY);
    coreGrad.addColorStop(0, 'rgba(168,85,247,0.0)');
    coreGrad.addColorStop(0.1, 'rgba(168,85,247,0.5)');
    coreGrad.addColorStop(0.5, 'rgba(139,92,246,0.7)');
    coreGrad.addColorStop(1, 'rgba(59,130,246,0.9)');
    ctx.strokeStyle = coreGrad;
    ctx.lineWidth = 3 * breathe;
    ctx.shadowColor = '#8b5cf6';
    ctx.shadowBlur = 24 * breathe;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx, baseY - 22);
    ctx.lineTo(cx, topY + 10);
    ctx.stroke();
    ctx.restore();

    // levels
    levels.forEach((lvl, i) => {
      const y = baseY - 30 - lvl.t * towerH;
      const isActive = prog >= lvl.raw - 0.001;
      if (isActive && !lvl.active) {
        lvl.active = true;
        lvl.activatedAt = time;
        ripples.push({ y, t: time, hue: i / levels.length });
      }

      const platformR = lerp(68, 12, lvl.t) * (W < 700 ? 0.75 : 1) * breathe;
      const glow = isActive ? 1 : 0.45;

      // platform glow
      ctx.save();
      ctx.globalAlpha = glow;
      const pg = ctx.createRadialGradient(cx, y, 0, cx, y, platformR*1.8);
      pg.addColorStop(0, 'rgba(192,132,252,0.45)');
      pg.addColorStop(0.4, 'rgba(96,165,250,0.25)');
      pg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = pg;
      ctx.beginPath();
      ctx.arc(cx, y, platformR*1.8, 0, TAU);
      ctx.fill();
      ctx.restore();

      // platform ring
      ctx.save();
      ctx.translate(cx, y);
      const rot = time * 0.2 + i * 0.3;
      ctx.rotate(rot * (i%2? -1:1) * 0.15);
      ctx.strokeStyle = isActive ? 'rgba(216,180,254,0.95)' : 'rgba(100,116,139,0.5)';
      ctx.lineWidth = isActive ? 2.2 : 1.2;
      ctx.shadowColor = isActive ? '#c084fc' : '#334155';
      ctx.shadowBlur = isActive ? 18 : 6;
      ctx.beginPath();
      // hexagon fractal hint
      const sides = 6;
      const r1 = platformR * 0.85;
      for (let s = 0; s <= sides; s++) {
        const a = s/sides * TAU;
        const px = Math.cos(a) * r1;
        const py = Math.sin(a) * r1 * 0.55; // perspective squash
        if (s===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();

      // inner core dot
      ctx.shadowBlur = isActive ? 14 : 4;
      ctx.fillStyle = isActive ? '#e9d5ff' : '#475569';
      ctx.beginPath();
      ctx.arc(0, 0, isActive ? 3.2 : 2, 0, TAU);
      ctx.fill();
      ctx.restore();

      // label
      if (isActive) {
        const side = i % 2 === 0 ? 1 : -1;
        const lx = cx + side * (platformR + lerp(70, 38, lvl.t) + (W<500?10:0));
        const ly = y;
        ctx.save();
        ctx.font = `${i===10?'700':'600'} ${i===10?18:14}px "JetBrains Mono", monospace`;
        ctx.textAlign = side>0 ? 'left' : 'right';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = i===10 ? '#ffffff' : '#c084fc';
        ctx.shadowBlur = i===0 ? 8 : i===10 ? 22 : 14;
        ctx.fillStyle = i===10 ? '#ffffff' : (i===0 ? '#f0abfc' : '#ddd6fe');
        ctx.globalAlpha = 0.96;
        ctx.fillText(lvl.label, lx, ly);
        // tick
        ctx.globalAlpha = 0.7;
        ctx.strokeStyle = 'rgba(167,139,250,0.6)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx + side * (platformR*0.6), ly);
        ctx.lineTo(lx - side*6, ly);
        ctx.stroke();
        ctx.restore();
      }
    });

    // ripples
    ctx.save();
    for (let i = ripples.length-1; i>=0; i--) {
      const r = ripples[i];
      const age = time - r.t;
      if (age > 1.8) { ripples.splice(i,1); continue; }
      const pr = age * 180;
      const alpha = (1 - age/1.8) * 0.7;
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = `hsla(${270 - r.hue*40}, 90%, 75%, ${alpha})`;
      ctx.lineWidth = 2;
      ctx.shadowColor = '#c084fc';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.ellipse(cx, r.y, pr, pr*0.28, 0, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();

    // ascension pulse trail
    ctx.save();
    const trailGrad = ctx.createLinearGradient(cx, baseY, cx, pulseY);
    trailGrad.addColorStop(0, 'rgba(168,85,247,0)');
    trailGrad.addColorStop(0.5, 'rgba(168,85,247,0.35)');
    trailGrad.addColorStop(1, 'rgba(236,72,153,0.85)');
    ctx.strokeStyle = trailGrad;
    ctx.lineWidth = 6;
    ctx.shadowColor = '#d946ef';
    ctx.shadowBlur = 24;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx, baseY - 28);
    ctx.lineTo(cx, pulseY);
    ctx.stroke();
    ctx.restore();

    // pulse orb
    ctx.save();
    const poff = Math.sin(time*3.5)*1.5;
    ctx.translate(cx, pulseY + poff);
    const pulseScale = 1 + Math.sin(time*4)*0.08;
    ctx.scale(pulseScale, pulseScale);
    // outer
    const og = ctx.createRadialGradient(0,0,0,26);
    og.addColorStop(0, 'rgba(255,255,255,0.95)');
    og.addColorStop(0.2, 'rgba(232,121,249,0.9)');
    og.addColorStop(0.5, 'rgba(168,85,247,0.5)');
    og.addColorStop(1, 'rgba(168,85,247,0)');
    ctx.fillStyle = og;
    ctx.shadowColor = '#e879f9';
    ctx.shadowBlur = 35;
    ctx.beginPath();
    ctx.arc(0,0,26,0,TAU);
    ctx.fill();
    // core
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(0,0,5.5,0,TAU);
    ctx.fill();
    ctx.restore();

    // top cap - 9.00 singularity
    ctx.save();
    const topActive = prog > 0.985;
    ctx.translate(cx, topY);
    ctx.globalAlpha = topActive ? 1 : 0.7;
    const tg = ctx.createRadialGradient(0,0,0,40);
    tg.addColorStop(0, 'rgba(255,255,255,0.9)');
    tg.addColorStop(0.3, 'rgba(96,165,250,0.8)');
    tg.addColorStop(1, 'rgba(59,130,246,0)');
    ctx.fillStyle = tg;
    ctx.shadowColor = '#60a5fa';
    ctx.shadowBlur = topActive ? 45 : 25;
    ctx.beginPath();
    ctx.arc(0,0,38,0,TAU);
    ctx.fill();
    ctx.restore();
  }

  function animate(ts) {
    time = ts * 0.001;
    ctx.clearRect(0,0,W,H);
    // vignette
    const vg = ctx.createRadialGradient(cx, cy, Math.min(W,H)*0.2, cx, cy, Math.max(W,H)*0.7);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vg;
    ctx.fillRect(0,0,W,H);

    drawTower();

    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
