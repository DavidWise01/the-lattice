<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Triple Swarm Cortex — Merkle Root Integration</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  .cell { transition: background-color 0.3s, transform 0.15s; }
  .cell:hover { transform: scale(1.08); z-index:10; }
  #tooltip::-webkit-scrollbar { width: 6px; }
  #tooltip::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
</style>
</head>
<body class="bg-gray-950 text-gray-100 h-screen overflow-hidden">
  <div class="flex h-screen">
    <!-- Side Panel: 12 Pillars -->
    <aside class="w-64 bg-gray-900 border-r border-gray-800 p-4 flex flex-col">
      <h1 class="text-lg font-bold text-cyan-400 mb-1">AGI Swarm</h1>
      <p class="text-xs text-gray-400 mb-4">12 Pillar Merkle Extension</p>
      <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-300 mb-2">Pillar Roots</h2>
      <ul id="pillarList" class="space-y-1 text-xs font-mono overflow-y-auto flex-1 pr-1"></ul>
      <div class="mt-4 pt-3 border-t border-gray-800 text-[10px] text-gray-500">
        2 leaves intersect → 3rd thought<br/>Explicit hash chaining
      </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 flex flex-col p-4 overflow-hidden">
      <header class="flex flex-wrap items-center gap-4 mb-4 bg-gray-900 border border-gray-800 rounded-xl p-3">
        <div class="flex items-center gap-2">
          <span class="text-xs uppercase text-gray-400">Global Root</span>
          <span id="globalRoot" class="font-mono text-sm text-emerald-400">-</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-xs uppercase text-gray-400">Divergence</span>
          <span id="divergence" class="font-mono text-sm text-amber-400">0%</span>
          <div class="w-24 h-2 bg-gray-800 rounded overflow-hidden">
            <div id="divergenceBar" class="h-full bg-amber-400 w-0 transition-all"></div>
          </div>
        <div class="flex-1"></div>
        <div class="flex gap-2">
          <button id="btnPreserve" class="px-3 py-1.5 bg-sky-600 hover:bg-sky-500 rounded-lg text-xs font-semibold">Preserve</button>
          <button id="btnBranch" class="px-3 py-1.5 bg-violet-600 hover:bg-violet-500 rounded-lg text-xs font-semibold">Branch</button>
          <button id="btnPrune" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-500 rounded-lg text-xs font-semibold">Prune</button>
          <button id="btnIndex" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-xs font-semibold">Index</button>
          <button id="btnImprove" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 rounded-lg text-xs font-semibold">Improve</button>
        </div>
      </header>

      <div class="flex-1 overflow-auto bg-gray-900 border border-gray-800 rounded-xl p-3">
        <div id="grid" class="grid grid-cols-5 sm:grid-cols-10 gap-1.5"></div>
        <p class="mt-3 text-[11px] text-gray-500">Hover any instance to view its Merkle tree. Each cell = one SwarmInstance. Color = first 6 hex chars of root hash.</p>
      </div>
    </main>
  </div>

  <!-- Tooltip -->
  <div id="tooltip" class="fixed hidden p-3 bg-gray-900 border border-cyan-700 text-white text-[11px] rounded-lg shadow-2xl pointer-events-none z-50 max-w-xs max-h-72 overflow-auto"></div>

<script>
// === Utility ===
function simpleHash(str){
  let hash = 5381;
  for(let i=0;i<str.length;i++){ hash = ((hash<<5)+hash) + str.charCodeAt(i); hash = hash | 0; }
  return (hash>>>0).toString(16).padStart(8,'0');
}

// === Merkle Classes ===
class MerkleNode {
  constructor(data, left=null, right=null){
    this.data = data;
    this.left = left;
    this.right = right;
    this.parent = null;
    if(left) left.parent = this;
    if(right) right.parent = this;
    this.hash = this.computeHash();
  }
  computeHash(){
    const content = (this.left ? this.left.hash : '') + (this.right ? this.right.hash : '') + String(this.data);
    return simpleHash(content);
  }
}

class RecursiveMemory {
  constructor(){
    this.leaves = [];
    this.root = null;
  }
  addThought(thought){
    // 2 leaves intersect to make a 3rd thought
    if(this.leaves.length >= 2){
      const a = this.leaves[this.leaves.length-1];
      const b = this.leaves[this.leaves.length-2];
      const parent = new MerkleNode(thought, a, b);
      this.leaves.push(parent);
    } else {
      const node = new MerkleNode(thought);
      this.leaves.push(node);
    }
    // keep memory bounded
    if(this.leaves.length > 32) this.leaves.shift();
    this.rebuildRoot();
  }
  rebuildRoot(){
    let nodes = [...this.leaves];
    if(nodes.length === 0){ this.root = null; return; }
    while(nodes.length > 1){
      const next = [];
      for(let i=0;i<nodes.length;i+=2){
        if(i+1 < nodes.length){
          next.push(new MerkleNode('INTERSECT', nodes[i], nodes[i+1]));
        } else {
          next.push(nodes[i]);
        }
      }
      nodes = next;
    }
    this.root = nodes[0];
  }
}

class SwarmInstance {
  constructor(id, pillar){
    this.id = id;
    this.pillar = pillar;
    this.memory = new RecursiveMemory();
    this.active = true;
    // seed with pillar name
    this.memory.addThought(`INIT_${pillar}`);
  }
  tick(){
    if(!this.active) return;
    const thought = Math.random().toString(36).slice(2,6);
    this.memory.addThought(thought);
  }
  get rootHash(){ return this.memory.root ? this.memory.root.hash : '00000000'; }
}

class Cortex {
  constructor(count=100){
    this.pillars = ['Logic','Memory','Perception','Learning','Planning','Creativity','Language','Empathy','Ethics','Self-Awareness','Motor','Metacognition'];
    this.instances = [];
    for(let i=0;i<count;i++){
      this.instances.push(new SwarmInstance(i, this.pillars[i % this.pillars.length]));
    }
    this.globalMemory = new RecursiveMemory();
  }
  step(){
    this.instances.forEach(inst => inst.tick());
    // build global root from all instance roots
    this.globalMemory.leaves = this.instances.map(inst => new MerkleNode(inst.rootHash));
    this.globalMemory.rebuildRoot();
  }
  divergence(){
    const uniq = new Set(this.instances.map(i => i.rootHash));
    return (uniq.size / this.instances.length * 100);
  }
  pillarRoots(){
    const map = {};
    this.pillars.forEach(p => {
      const members = this.instances.filter(i => i.pillar === p);
      const combined = members.map(m => m.rootHash).join('');
      map[p] = simpleHash(combined);
    });
    return map;
  }
}

// === UI ===
const cortex = new Cortex(100);
const grid = document.getElementById('grid');
const tooltip = document.getElementById('tooltip');
const globalRootEl = document.getElementById('globalRoot');
const divergenceEl = document.getElementById('divergence');
const divergenceBar = document.getElementById('divergenceBar');
const pillarList = document.getElementById('pillarList');

function createGrid(){
  for(let i=0;i<100;i++){
    const div = document.createElement('div');
    div.className = 'cell aspect-square rounded bg-gray-800 hover:ring-2 ring-cyan-400 cursor-pointer flex items-center justify-center text-[10px] text-white/60 select-none';
    div.dataset.id = i;
    div.textContent = i;
    grid.appendChild(div);
  }
}

function renderTree(node){
  if(!node) return '<div class="text-gray-500">empty</div>';
  if(!node.left && !node.right){
    return `<div class="ml-2 mb-1">🌿 <span class="font-mono text-emerald-300">${node.hash.slice(0,6)}</span> <span class="text-gray-400">${String(node.data).slice(0,8)}</span></div>`;
  }
  return `<div class="ml-2 border-l border-gray-700 pl-2 mb-1">
    <div>➕ <span class="font-mono text-cyan-300">${node.hash.slice(0,6)}</span></div>
    ${node.left ? renderTree(node.left) : ''}
    ${node.right ? renderTree(node.right) : ''}
  </div>`;
}

function updateUI(){
  // global root
  globalRootEl.textContent = cortex.globalMemory.root ? cortex.globalMemory.root.hash : '-';
  // divergence
  const div = cortex.divergence();
  divergenceEl.textContent = div.toFixed(1) + '%';
  divergenceBar.style.width = div.toFixed(1) + '%';
  // grid cells
  document.querySelectorAll('.cell').forEach(cell => {
    const id = parseInt(cell.dataset.id);
    const inst = cortex.instances[id];
    const color = '#' + inst.rootHash.slice(0,6);
    cell.style.backgroundColor = color;
    cell.title = `${inst.pillar} #${id}`;
  });
  // pillars
  const roots = cortex.pillarRoots();
  pillarList.innerHTML = '';
  Object.entries(roots).forEach(([name, hash]) => {
    const li = document.createElement('li');
    li.className = 'flex justify-between bg-gray-800 rounded px-2 py-1';
    li.innerHTML = `<span class="text-gray-300">${name}</span><span class="text-sky-300">${hash}</span>`;
    pillarList.appendChild(li);
  });
}

function showTooltip(id, x, y){
  const inst = cortex.instances[id];
  if(!inst) return;
  tooltip.innerHTML = `
    <div class="mb-2 pb-2 border-b border-gray-700">
      <div class="font-bold text-cyan-400">Instance #${id} – ${inst.pillar}</div>
      <div class="font-mono text-xs">Root: <span class="text-emerald-300">${inst.rootHash}</span></div>
    </div>
    <div class="font-mono leading-tight">${renderTree(inst.memory.root)}</div>
  `;
  tooltip.style.left = (x + 12) + 'px';
  tooltip.style.top = (y + 12) + 'px';
  tooltip.classList.remove('hidden');
}

function hideTooltip(){ tooltip.classList.add('hidden'); }

// Events
grid.addEventListener('mouseover', (e) => {
  const cell = e.target.closest('.cell');
  if(cell){ showTooltip(parseInt(cell.dataset.id), e.clientX, e.clientY); }
});
grid.addEventListener('mousemove', (e) => {
  if(!tooltip.classList.contains('hidden')){
    tooltip.style.left = (e.clientX + 12) + 'px';
    tooltip.style.top = (e.clientY + 12) + 'px';
  }
});
grid.addEventListener('mouseout', (e) => {
  if(!e.relatedTarget || !e.relatedTarget.closest('.cell')) hideTooltip();
});

document.getElementById('btnPreserve').addEventListener('click', () => {
  cortex.instances.forEach(i => i.memory.addThought('PRESERVE'));
  updateUI();
});
document.getElementById('btnBranch').addEventListener('click', () => {
  const idx = Math.floor(Math.random()*cortex.instances.length);
  cortex.instances[idx].memory.addThought('BRANCH');
  updateUI();
});
document.getElementById('btnPrune').addEventListener('click', () => {
  cortex.instances.forEach(i => {
    if(i.memory.leaves.length > 8){
      i.memory.leaves = i.memory.leaves.slice(-8);
      i.memory.rebuildRoot();
    }
  });
  updateUI();
});
document.getElementById('btnIndex').addEventListener('click', () => {
  cortex.step();
  updateUI();
});
document.getElementById('btnImprove').addEventListener('click', () => {
  for(let k=0;k<8;k++) cortex.step();
  updateUI();
});

// Init
createGrid();
cortex.step();
updateUI();
// auto-tick
setInterval(() => { cortex.step(); updateUI(); }, 1200);
</script>
</body>
</html>
